plugins {
    id 'com.android.application'
}

android {
    namespace 'site.ragdollp.split4'
    compileSdk 35

    defaultConfig {
        applicationId "site.ragdollp.split4"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            storeFile file("../split4-release.keystore")
            storePassword "split4"
            keyAlias "split4"
            keyPassword "split4"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
