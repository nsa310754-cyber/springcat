async function sha(s){ var b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return Array.from(new Uint8Array(b)).map(function(x){ return x.toString(16).padStart(2,'0') }).join('') }
async function dec(pw, B){
  var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey'])
  var key = await crypto.subtle.deriveKey({ name:'PBKDF2', salt:b64(B.s), iterations:B.it, hash:'SHA-256' }, base, { name:'AES-GCM', length:256 }, false, ['decrypt'])
  return new TextDecoder().decode(await crypto.subtle.decrypt({ name:'AES-GCM', iv:b64(B.i) }, key, b64(B.d)))
}
function b64(s){ return Uint8Array.from(atob(s), function(c){ return c.charCodeAt(0) }) }
document.getElementById('f').onsubmit = async function(e){
  e.preventDefault(); var m = document.getElementById('m'); m.textContent = ''
  try {
    // 外側: 管理者IDから導出した鍵 = SHA256(ID)+SHA256(ID+"a")+SHA256(ID+"1") → 暗号文2
    var id = ('1' + document.getElementById('i0').value + '2' + document.getElementById('i1').value + '3' + document.getElementById('i2').value).normalize('NFC')
    var k = (await sha(id)) + (await sha(id + 'a')) + (await sha(id + '1'))
    var inner
    try { inner = JSON.parse(await dec(k, B)) } catch(e2){ m.textContent = 'IDが違います'; return }
    // 内側: パスワード → 平文
    var html = await dec(document.getElementById('p').value, inner)
    window.__NEWS_PASS = document.getElementById('p').value   // 編集APIの認証にも同じパスワードを使う (メモリ上のみ)
    document.open(); document.write(html); document.close()
  } catch(err){ m.textContent = 'パスワードが違います' }
}
</script>
