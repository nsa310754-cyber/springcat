function b64(s){ return Uint8Array.from(atob(s), function(c){ return c.charCodeAt(0) }) }
document.getElementById('f').onsubmit = async function(e){
  e.preventDefault(); var m = document.getElementById('m'); m.textContent = ''
  try {
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(document.getElementById('p').value), 'PBKDF2', false, ['deriveKey'])
    var key = await crypto.subtle.deriveKey({ name:'PBKDF2', salt:b64(B.s), iterations:B.it, hash:'SHA-256' }, base, { name:'AES-GCM', length:256 }, false, ['decrypt'])
    var html = new TextDecoder().decode(await crypto.subtle.decrypt({ name:'AES-GCM', iv:b64(B.i) }, key, b64(B.d)))

  } catch(err){ m.textContent = 'パスワードが違います' }
