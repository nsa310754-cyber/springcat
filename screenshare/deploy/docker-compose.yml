services:
  relay:
    build:
      context: ../server
    restart: unless-stopped
    environment:
      - PORT=8787
      - DEVICES_FILE=/data/devices.json
    volumes:
      - ./data:/data
    # Not published to the host directly - only Caddy talks to it, over the
    # internal compose network, so the relay is never reachable without TLS.
    expose:
      - "8787"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - relay
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
