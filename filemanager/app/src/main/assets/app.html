<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>SpringCat Files</title>
<style>
  :root{
    --bg:#0f1420; --panel:#161c2b; --panel2:#1e2740; --line:#28324c;
    --text:#e7ecf5; --muted:#94a3c4; --accent:#5b9dff; --accent2:#7c5bff;
    --danger:#ff5b6e; --ok:#3ddc84; --warn:#ffcf5b;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,"Roboto","Noto Sans JP",sans-serif;overscroll-behavior:none}
  body{display:flex;flex-direction:column}
  .top{background:var(--panel);padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;
    border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  .title{font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px}
  .title .cat{font-size:20px}
  .pathbar{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:12px;color:var(--muted);
    overflow-x:auto;white-space:nowrap}
  .crumb{color:var(--accent);text-decoration:none}
  .toolbar{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .btn{background:var(--panel2);border:1px solid var(--line);color:var(--text);
    border-radius:10px;padding:8px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
  .btn:active{transform:scale(.97)}
  .btn.pri{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none}
  .btn.dan{color:var(--danger);border-color:var(--danger)}
  .btn.sm{padding:6px 9px;font-size:12px}
  .list{flex:1;overflow-y:auto;padding:6px 8px 96px}
  .row{display:flex;align-items:center;gap:12px;padding:12px 10px;border-radius:12px;
    background:var(--panel);margin-bottom:6px;border:1px solid transparent}
  .row:active{background:var(--panel2)}
  .row.sel{border-color:var(--accent);background:var(--panel2)}
  .ico{font-size:24px;width:30px;text-align:center;flex-shrink:0}
  .meta{flex:1;min-width:0}
  .name{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sub{font-size:11px;color:var(--muted);margin-top:2px}
  .chev{color:var(--muted);font-size:18px}
  .check{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff}
  .check.on{background:var(--accent);border-color:var(--accent)}
  .fab{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom) + 16px);
    width:56px;height:56px;border-radius:28px;background:linear-gradient(135deg,var(--accent),var(--accent2));
    color:#fff;font-size:28px;display:flex;align-items:center;justify-content:center;border:none;
    box-shadow:0 8px 24px rgba(0,0,0,.4);z-index:6}
  .selbar{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);
    padding:10px 12px calc(env(safe-area-inset-bottom) + 10px);display:none;gap:8px;z-index:7;flex-wrap:wrap}
  .selbar.show{display:flex}
  .empty{color:var(--muted);text-align:center;padding:60px 20px;font-size:14px}
  /* modal */
  .modal{position:fixed;inset:0;background:rgba(6,9,16,.72);display:none;z-index:20;
    align-items:flex-end;justify-content:center}
  .modal.show{display:flex}
  .sheet{background:var(--panel);width:100%;max-width:640px;max-height:92%;border-radius:18px 18px 0 0;
    display:flex;flex-direction:column;border:1px solid var(--line)}
  .sheet.full{max-height:100%;height:100%;border-radius:0}
  .sheet h3{margin:0;padding:16px 16px 8px;font-size:16px;display:flex;align-items:center;gap:8px}
  .sheet .body{padding:0 16px 16px;overflow:auto;flex:1}
  .sheet .foot{padding:12px 16px calc(env(safe-area-inset-bottom) + 12px);border-top:1px solid var(--line);
    display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  .opt{display:flex;align-items:center;gap:12px;padding:14px 8px;border-bottom:1px solid var(--line);cursor:pointer}
  .opt:active{background:var(--panel2)}
  .opt .oi{font-size:20px;width:26px;text-align:center}
  input,textarea,select{background:var(--panel2);border:1px solid var(--line);color:var(--text);
    border-radius:10px;padding:10px;font-size:14px;width:100%;font-family:inherit}
  textarea{min-height:50vh;resize:vertical;white-space:pre;font-family:"SF Mono",ui-monospace,monospace;font-size:13px}
  .field{margin:10px 0}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
  pre.out{background:#0a0e17;border:1px solid var(--line);border-radius:10px;padding:12px;
    font-family:ui-monospace,monospace;font-size:12px;white-space:pre-wrap;word-break:break-word;
    max-height:40vh;overflow:auto;margin:0}
  .log-err{color:var(--danger)} .log-warn{color:var(--warn)} .log-info{color:var(--muted)}
  iframe.preview{width:100%;height:60vh;border:1px solid var(--line);border-radius:10px;background:#fff}
  .badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
  .badge.hi{background:rgba(255,91,110,.18);color:var(--danger)}
  .badge.mid{background:rgba(255,207,91,.18);color:var(--warn)}
  .badge.lo{background:rgba(61,220,132,.18);color:var(--ok)}
  .perm{font-size:11px;padding:6px 8px;border-radius:8px;background:var(--panel2);margin:4px 0;word-break:break-all}
  .perm.dang{color:var(--danger);border:1px solid rgba(255,91,110,.4)}
  .kv{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line)}
  .kv .k{color:var(--muted)}
  .bar{height:8px;border-radius:6px;background:var(--panel2);overflow:hidden;margin:6px 0}
  .bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#000d;color:#fff;
    padding:10px 16px;border-radius:22px;font-size:13px;z-index:50;opacity:0;transition:.25s;pointer-events:none;max-width:90%}
  .toast.show{opacity:1}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .chip{padding:8px 12px;border-radius:20px;background:var(--panel2);border:1px solid var(--line);font-size:13px;cursor:pointer}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .spin{width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;
    animation:sp 1s linear infinite;display:inline-block}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
  <div class="top">
    <div class="title"><span class="cat">🐱</span> SpringCat Files</div>
    <div class="pathbar" id="pathbar"></div>
    <div class="toolbar">
      <button class="btn sm" onclick="goUp()">⬆️ 上へ</button>
      <button class="btn sm" onclick="showRoots()">💾 ストレージ</button>
      <button class="btn sm" onclick="openSearch()">🔍 検索</button>
      <button class="btn sm" onclick="openSortMenu()">↕️ 並び替え</button>
      <button class="btn sm" onclick="toggleHidden()" id="hidBtn">👁 隠し</button>
      <button class="btn sm" onclick="toggleSelect()" id="selBtn">☑️ 選択</button>
      <button class="btn sm" onclick="openTools()">🧹 整理</button>
      <button class="btn sm" onclick="openStorageInfo()">📊 容量</button>
      <button class="btn sm" onclick="promptNewFolder()">📁+ フォルダ</button>
      <button class="btn sm" onclick="toggleBookmark()" id="bmBtn">☆ 登録</button>
      <button class="btn sm" onclick="gotoPath()">📍 パス移動</button>
      <button class="btn sm" onclick="checkRoot()">🔎 root確認</button>
      <button class="btn sm" onclick="toggleRoot()" id="rootBtn">🔓 ルート</button>
    </div>
  </div>

  <div class="list" id="list"><div class="empty"><span class="spin"></span></div></div>

  <button class="fab" onclick="promptNewFile()">＋</button>

  <div class="selbar" id="selbar">
    <button class="btn pri sm" onclick="openCompress()">🗜️ 圧縮</button>
    <button class="btn sm" onclick="pickDest('move')">📦 移動</button>
    <button class="btn sm" onclick="pickDest('copy')">📄 コピー</button>
    <button class="btn sm" onclick="shareSelected()">📤 共有</button>
    <button class="btn dan sm" onclick="deleteSelected()">🗑️ 削除</button>
    <button class="btn sm" onclick="clearSelect()">✕ 解除</button>
    <span style="color:var(--muted);font-size:12px;align-self:center" id="selCount"></span>
  </div>

  <!-- 汎用モーダル -->
  <div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

  <div class="toast" id="toast"></div>

<script>
/* =========================================================================
 *  SpringCat Files — フロントエンド
 *  ネイティブ側の window.Bridge が実ファイル操作を行う。ここはその UI 層。
 * ========================================================================= */
const B = window.Bridge;
const $ = id => document.getElementById(id);

/* ---- ネイティブ呼び出し (同期 JSON) の薄いラッパ ---- */
function call(fn, ...args){
  try { return JSON.parse(B[fn].apply(B, args)); }
  catch(e){ return {ok:false, error:'bridge: '+e.message}; }
}

let cwd = '';                 // 現在のディレクトリ
const navStack = [];          // 戻る用
let entries = [];             // 現在の一覧 (表示用: フィルタ/ソート適用済み)
let rawEntries = [];          // ネイティブから来た生の一覧
let selectMode = false;
const selected = new Set();

/* 表示設定 (localStorage に保存) */
let sortKey = localStorage.getItem('sortKey') || 'name';   // name|size|mtime|ext
let sortAsc = localStorage.getItem('sortAsc') !== '0';
let showHidden = localStorage.getItem('showHidden') === '1';
let bookmarks = [];
try{ bookmarks = JSON.parse(localStorage.getItem('bookmarks')||'[]'); }catch(e){ bookmarks=[]; }

function applyView(list){
  let a = list.slice();
  if(!showHidden) a = a.filter(e=>!e.name.startsWith('.'));
  const dir=v=>v.isDir?0:1;
  a.sort((x,y)=>{
    if(dir(x)!==dir(y)) return dir(x)-dir(y);       // フォルダ優先
    let r=0;
    if(sortKey==='size') r=(x.size||0)-(y.size||0);
    else if(sortKey==='mtime') r=(x.mtime||0)-(y.mtime||0);
    else if(sortKey==='ext') r=(x.ext||'').localeCompare(y.ext||'');
    else r=x.name.localeCompare(y.name,'ja');
    return sortAsc? r : -r;
  });
  return a;
}

/* ---------- 起動 ---------- */
window.addEventListener('load', init);
let rootMode = false;
async function init(){
  if(!B){ $('list').innerHTML='<div class="empty">Bridge 未接続 (アプリ内で開いてください)</div>'; return; }
  try{ if(B.isRootAvailable()){ $('rootBtn').style.display=''; } }catch(e){}
  if(!B.hasAllFilesAccess()){
    askAllFiles();
  } else {
    showRoots();
  }
}

/* ---------- root化 確認 ---------- */
function checkRoot(){ renderRootCheck(call('rootStatus', false)); }
function renderRootCheck(s){
  const yes='<span class="badge lo">あり</span>', no='<span class="badge hi">なし</span>';
  let verifyRow='';
  if(s.verified){
    verifyRow = s.granted
      ? `<div class="kv"><span class="k">権限テスト</span><span class="badge lo">成功 (uid=0)</span></div>
         <div class="kv"><span class="k">id 出力</span><span style="font-size:11px;word-break:break-all;text-align:right">${esc(s.uid)}</span></div>`
      : `<div class="kv"><span class="k">権限テスト</span><span class="badge hi">失敗 / 拒否</span></div>`;
  }
  let verdict;
  if(s.verified){
    verdict = s.granted ? '✅ root 化されており、権限も取得できました'
                        : '❌ su を実行できませんでした (未 root か、権限が拒否されました)';
  } else {
    verdict = s.binary ? '🔓 su バイナリを検出しました。「権限を取得してテスト」で確認してください。'
                       : 'ℹ️ su は固定パスで検出できませんでした。実機で確認するには「権限を取得してテスト」を押してください（Magisk 等は検出に出ないことがあります）。';
  }
  openSheet(`<h3>🔎 root化 確認</h3>
    <div class="body">
      <p style="font-size:14px;margin:4px 0 12px">${verdict}</p>
      <div class="kv"><span class="k">su バイナリ検出</span><span>${s.binary?yes:no}</span></div>
      ${s.suPath?`<div class="kv"><span class="k">su パス</span><span style="font-size:11px">${esc(s.suPath)}</span></div>`:''}
      <div class="kv"><span class="k">test-keys 署名</span><span>${s.testKeys?yes:no}</span></div>
      <div class="kv"><span class="k">ルートモード</span><span>${s.rootMode?'<span class="badge lo">ON</span>':'OFF'}</span></div>
      ${verifyRow}
      <p class="sub" style="margin-top:12px">「権限を取得してテスト」を押すと実際に <code>su -c id</code> を実行します
      (Magisk 等の許可ダイアログが出ることがあります)。</p>
    </div>
    <div class="foot">
      <button class="btn" onclick="closeSheet()">閉じる</button>
      <button class="btn pri" onclick="verifyRoot()">🔐 権限を取得してテスト</button>
      ${s.verified&&s.granted&&!s.rootMode?`<button class="btn pri" onclick="enableRootFromCheck()">🔓 ルートモードON</button>`:''}
      ${s.rootMode?`<button class="btn" onclick="disableRootFromCheck()">🔒 ルート解除</button>`:''}
    </div>`);
}
function verifyRoot(){
  toast('su を実行中…');
  setTimeout(()=>{ renderRootCheck(call('rootStatus', true)); }, 30);
}
function enableRootFromCheck(){
  const r=call('setRootMode', true);
  if(r.ok){ rootMode=true; updateRootBtn(); toast('ルートモード ON 🔓'); renderRootCheck(call('rootStatus', false)); refresh(); }
  else toast(r.error||'許可されませんでした');
}
function disableRootFromCheck(){
  call('setRootMode', false); rootMode=false; updateRootBtn();
  toast('ルートモード OFF'); renderRootCheck(call('rootStatus', false)); refresh();
}

/* ---------- ルート (スーパーユーザー) ---------- */
function toggleRoot(){
  if(rootMode){
    const r=call('setRootMode', false); rootMode=false; updateRootBtn();
    toast('ルートモード OFF'); refresh(); return;
  }
  openSheet(`<h3>🔓 スーパーユーザー権限</h3>
    <div class="body">
      <p style="font-size:13px;line-height:1.7;color:var(--muted)">
      ルートモードを有効にすると、通常のファイルアプリでは開けない領域
      (<code>/data/data</code>・<code>/system</code> 等) を閲覧・編集できます。
      アプリのコードや設定ファイルの確認に使えます。<br><br>
      有効化すると Magisk などのスーパーユーザー管理アプリが許可を求めます。
      root 権限では端末を破損させる操作も可能です。慎重に扱ってください。</p>
    </div>
    <div class="foot">
      <button class="btn" onclick="closeSheet()">やめる</button>
      <button class="btn pri" onclick="doEnableRoot()">🔓 権限を要求</button>
    </div>`);
}
function doEnableRoot(){
  toast('権限を要求中…');
  setTimeout(()=>{
    const r=call('setRootMode', true);
    if(r.ok){ rootMode=true; updateRootBtn(); closeSheet(); toast('ルートモード ON 🔓'); refresh(); }
    else { toast(r.error||'許可されませんでした'); }
  },30);
}
function updateRootBtn(){ const b=$('rootBtn'); if(b) b.textContent = rootMode?'🔒 ルート解除':'🔓 ルート';
  b && b.classList.toggle('pri', rootMode); }

/* ---------- パス指定で移動 ---------- */
function gotoPath(){
  openSheet(`<h3>📍 パスへ移動</h3>
    <div class="body">
      <div class="field"><input id="gpPath" value="${esc(cwd||'/')}" placeholder="/data/data/パッケージ名"></div>
      <div class="chips">
        ${['/','/sdcard','/storage/emulated/0','/data','/data/data','/system','/system/app','/data/local/tmp']
          .map(p=>`<span class="chip" onclick="$('gpPath').value=${q(p)}">${esc(p)}</span>`).join('')}
      </div>
      <p class="sub">/data や /system は多くの端末でルートモードが必要です。</p>
    </div>
    <div class="foot"><button class="btn" onclick="closeSheet()">キャンセル</button>
      <button class="btn pri" onclick="doGoto()">移動</button></div>`);
  setTimeout(()=>{ const el=$('gpPath'); if(el) el.focus(); },100);
}
function doGoto(){ const p=$('gpPath').value.trim(); if(!p) return; closeSheet(); navTo(p); }

function askAllFiles(){
  openSheet(`<h3>📂 ストレージへのアクセス</h3>
    <div class="body">
      <p style="color:var(--muted);font-size:13px;line-height:1.6">
      端末内のファイルを扱うため「すべてのファイルへのアクセス」を許可してください。
      許可後この画面に戻ると自動で読み込みます。</p>
    </div>
    <div class="foot">
      <button class="btn" onclick="closeSheet();showRoots()">後で</button>
      <button class="btn pri" onclick="B.requestAllFilesAccess()">設定を開く</button>
    </div>`);
}
window.onAllFilesResult = function(granted){
  closeSheet();
  if(granted) showRoots(); else toast('アクセスが許可されていません');
};

/* ---------- ルート/ストレージ ---------- */
function showRoots(){
  const r = call('roots');
  if(!r.ok){ toast(r.error); return; }
  let h = '<div class="empty" style="padding:20px 10px"><b>ストレージを選択</b></div>';
  h = '';
  for(const root of r.roots){
    if(!root.exists) continue;
    h += `<div class="row" onclick="navTo(${q(root.path)})">
      <div class="ico">💾</div>
      <div class="meta"><div class="name">${esc(root.name)}</div>
      <div class="sub">${esc(root.path)}</div></div><div class="chev">›</div></div>`;
  }
  // ブックマーク
  if(bookmarks.length){
    h += '<div class="sub" style="padding:14px 10px 4px">★ ブックマーク</div>';
    for(const bp of bookmarks){
      h += `<div class="row" onclick="navTo(${q(bp)})">
        <div class="ico">⭐</div>
        <div class="meta"><div class="name">${esc(bp.split('/').pop()||bp)}</div>
        <div class="sub">${esc(bp)}</div></div>
        <button class="btn sm" onclick="event.stopPropagation();removeBookmark(${q(bp)})">✕</button></div>`;
    }
  }
  cwd = ''; navStack.length=0; clearSelect();
  updateBookmarkBtn();
  $('pathbar').innerHTML = '<b>ストレージ</b>';
  $('list').innerHTML = h || '<div class="empty">利用可能なストレージがありません</div>';
}
function removeBookmark(p){ const i=bookmarks.indexOf(p); if(i>=0){ bookmarks.splice(i,1);
  localStorage.setItem('bookmarks', JSON.stringify(bookmarks)); showRoots(); toast('ブックマーク解除'); } }

function openStorageInfo(){
  const r = call('storageInfo');
  if(!r.ok){ toast(r.error); return; }
  let h='<div class="body">';
  for(const v of r.volumes){
    const pct = v.total? Math.round(v.used/v.total*100):0;
    h += `<div style="margin:14px 0">
      <div class="name">${esc(v.name)}</div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="sub">${fmtSize(v.used)} / ${fmtSize(v.total)} 使用 ・ 空き ${fmtSize(v.free)} (${pct}%)</div>
    </div>`;
  }
  h+='</div>';
  openSheet(`<h3>📊 ストレージ容量</h3>${h}<div class="foot">
    <button class="btn pri" onclick="closeSheet()">閉じる</button></div>`);
}

/* ---------- ナビゲーション ---------- */
function navTo(path){
  const r = call('list', path);
  if(!r.ok){
    if(r.rootHint && !rootMode && B.isRootAvailable()) return offerRoot(path);
    toast(r.error); return;
  }
  if(cwd) navStack.push(cwd);
  render(r);
}
function offerRoot(path){
  openSheet(`<h3>🔒 権限が必要です</h3>
    <div class="body"><p style="font-size:13px;line-height:1.7;color:var(--muted)">
    <b>${esc(path)}</b><br>このフォルダは通常のアクセス権では開けません。
    root 化された端末なら、スーパーユーザー権限で閲覧できます。</p></div>
    <div class="foot"><button class="btn" onclick="closeSheet()">やめる</button>
      <button class="btn pri" onclick="closeSheet();enableRootThenGo(${q(path)})">🔓 ルートで開く</button></div>`);
}
function enableRootThenGo(path){
  const r=call('setRootMode', true);
  if(r.ok){ rootMode=true; updateRootBtn(); toast('ルートモード ON 🔓'); navTo(path); }
  else toast(r.error||'許可されませんでした');
}
function goUp(){
  if(!cwd){ return; }
  const r = call('list', cwd);
  if(r.ok && r.parent){ navStack.push(cwd); const p=call('list', r.parent); if(p.ok) render(p); else showRoots(); }
  else showRoots();
}
window.onAndroidBack = function(){
  if($('modal').classList.contains('show')){ closeSheet(); return true; }
  if(selectMode){ clearSelect(); return true; }
  if(navStack.length){ const prev=navStack.pop(); const r=call('list',prev); if(r.ok){ render(r,true); return true; } }
  if(cwd){ showRoots(); return true; }
  return false; // 何もなければアプリ終了
};

function render(r, noPush){
  cwd = r.path; rawEntries = r.entries; entries = applyView(rawEntries);
  clearSelect();
  updateBookmarkBtn();
  // パンくず
  const parts = cwd.split('/').filter(Boolean);
  let acc=''; let pb='<a class="crumb" onclick="showRoots()">💾</a>';
  for(const p of parts){ acc+='/'+p; const path=acc;
    pb += ' / <a class="crumb" onclick="navTo('+q(path)+')">'+esc(p)+'</a>'; }
  $('pathbar').innerHTML = pb;

  if(!entries.length){ $('list').innerHTML='<div class="empty">📭 空のフォルダ</div>'; return; }
  let h='';
  entries.forEach((e,i)=>{
    const icon = e.isDir? '📁' : iconFor(e.ext, e.name);
    const sub = e.isDir? 'フォルダ' : (fmtSize(e.size)+' ・ '+fmtDate(e.mtime));
    h += `<div class="row" id="row${i}" onclick="onTap(${i})">
      <div class="check" id="chk${i}" style="display:none"></div>
      <div class="ico">${icon}</div>
      <div class="meta"><div class="name">${esc(e.name)}</div><div class="sub">${sub}</div></div>
      <button class="btn sm" onclick="event.stopPropagation();openItemMenu(${i})">⋮</button>
    </div>`;
  });
  $('list').innerHTML = h;
  refreshChecks();
}

/* ---------- タップ処理 ---------- */
function onTap(i){
  const e = entries[i];
  if(selectMode){ toggleSel(i); return; }
  if(e.isDir){ navTo(e.path); return; }
  const ext = e.ext;
  if(isArchive(ext)) return openArchive(e);
  if(ext==='apk') return openApk(e);
  if(ext==='html'||ext==='htm') return previewHtml(e);
  if(ext==='jsx'||ext==='tsx') return previewJsx(e);
  if(ext==='js'||ext==='mjs'||ext==='ts') return runScript(e);
  if(isImage(ext)) return previewImage(e);
  if(isText(ext, e.name)) return openEditor(e);
  // 不明: メニューへ
  openItemMenu(i);
}

/* ---------- アイテム別メニュー (⋮) ---------- */
function openItemMenu(i){
  const e = entries[i];
  const opt = (ico,label,fn)=>`<div class="opt" onclick="closeSheet();${fn}"><div class="oi">${ico}</div><div>${label}</div></div>`;

    items+=opt('🔤','テキストとして強制で開く',`forceText(${q(e.path)})`);
    if(isArchive(e.ext)) items+=opt('📦','ここに解凍',`extractPath(${q(e.path)})`);
    if(e.ext==='apk') items+=opt('🛡️','APKを検査してインストール',`openApkPath(${q(e.path)})`);
    items+=opt('🧩','APKとしてインストール',`installAs(${q(e.path)})`);
    items+=opt('🔁','別のアプリ/形式で開く',`openAsDialog(${q(e.path)})`);
    items+=opt('🌐','HTMLとしてプレビュー',`previewHtmlPath(${q(e.path)})`);

  items+=opt('✏️','名前/拡張子を変更',`renameDialog(${q(e.path)},${q(e.name)})`);
  items+=opt('📄','コピー',`copyDialog(${q(e.path)},${q(e.name)})`);

/* ---------- コード実行 (多言語 / ローカルJS) ----------
 * JS/TS はオフラインでも WebView サンドボックスで実行可能。
 * それ以外の言語 (Python/Ruby/Go/C/C++/Java/Rust/PHP/Bash/Kotlin/Swift/C#/Lua/Perl/R…)
 * はオンライン時に Piston API (emkc.org) 経由で実行して出力を表示する。
 * HTTP はネイティブ経由 (Bridge.httpRequest) なので CORS の影響を受けない。 */
const PISTON = 'https://emkc.org/api/v2/piston';
// 拡張子 → Piston 言語名
const LANG_BY_EXT = {py:'python',rb:'ruby',go:'go',c:'c',cpp:'c++',cc:'c++',cxx:'c++',
  h:'c',hpp:'c++',java:'java',rs:'rust',php:'php',sh:'bash',bash:'bash',kt:'kotlin',
  swift:'swift',cs:'csharp',lua:'lua',pl:'perl',r:'r',dart:'dart',jl:'julia',
  scala:'scala',hs:'haskell',clj:'clojure',ex:'elixir',erl:'erlang',fs:'fsharp',
  nim:'nim',zig:'zig',d:'d',jsx:'javascript',mjs:'javascript',js:'javascript',
  ts:'typescript',tsx:'typescript',py3:'python',pyw:'python',vb:'vb'};
let PISTON_RUNTIMES = null;

function runScript(e){ runPath(e.path); }
function runPath(path){
  const r = call('readText', path);
  if(!r.ok){ toast(r.error); return; }
  const ext = (path.split('.').pop()||'').toLowerCase();
  const isJsTs = ['js','mjs','ts','jsx','tsx'].includes(ext);
  window._runCode = r.text;
  window._runLang = LANG_BY_EXT[ext] || 'python';
  const name = path.split('/').pop();
  openSheet(`<h3>▶️ 実行: ${esc(name)}</h3>
    <div class="body">
      <div class="field"><label>言語 (オンライン実行)</label>
        <select id="runLang"><option value="${esc(window._runLang)}">${esc(window._runLang)} (自動判定)</option></select>
        <p class="sub" id="runLangNote">${B.isOnline()?'言語一覧を読み込み中…':'オフラインです。多言語実行にはネット接続が必要です。'}</p>
      </div>
      <div class="field"><label>標準入力 (stdin・任意)</label>
        <textarea id="runStdin" style="min-height:12vh"></textarea></div>
      <pre class="out" id="runOut">▶ 「実行」を押してください</pre>
    </div>
    <div class="foot">
      <button class="btn" onclick="closeSheet()">閉じる</button>
      ${isJsTs?'<button class="btn" onclick="doRunLocal()">📴 ローカル実行</button>':''}
      <button class="btn pri" onclick="doRunOnline()">☁️ オンライン実行</button>
    </div>`, true);
  loadRuntimes();
}
async function loadRuntimes(){
  const note=$('runLangNote'), sel=$('runLang');
  if(!B.isOnline()){ return; }
  try{
    if(!PISTON_RUNTIMES){
      const res = call('httpRequest','GET', PISTON+'/runtimes','');
      if(!res.ok) throw new Error('runtimes '+ (res.status||res.error));
      PISTON_RUNTIMES = JSON.parse(res.body);
    }
    // 言語名の一覧 (重複除去)
    const langs=[...new Set(PISTON_RUNTIMES.map(r=>r.language))].sort();
    const cur = window._runLang;
    sel.innerHTML = langs.map(l=>`<option value="${esc(l)}" ${l===cur?'selected':''}>${esc(l)}</option>`).join('');
    if(!langs.includes(cur)) sel.insertAdjacentHTML('afterbegin',`<option value="${esc(cur)}" selected>${esc(cur)} (自動)</option>`);
    note.textContent = `${langs.length} 言語が利用可能。`;
  }catch(err){ note.innerHTML='<span class="log-warn">言語一覧の取得に失敗: '+esc(String(err.message||err))+'</span>'; }
}
function pistonVersion(lang){
  if(!PISTON_RUNTIMES) return '*';
  const m = PISTON_RUNTIMES.filter(r=>r.language===lang || (r.aliases||[]).includes(lang));
  return m.length? m[m.length-1].version : '*';
}
async function doRunOnline(){
  const out=$('runOut');
  const lang = $('runLang')? $('runLang').value : window._runLang;
  const stdin = $('runStdin')? $('runStdin').value : '';
  if(!B.isOnline()){ out.innerHTML='<span class="log-err">オフラインです。オンライン実行にはネット接続が必要です。</span>'; return; }
  out.innerHTML='<span class="spin"></span> 実行中… ('+esc(lang)+')';
  setTimeout(()=>{
    try{
      const ver = pistonVersion(lang);
      const payload = JSON.stringify({language:lang, version:ver,
        files:[{content:window._runCode}], stdin:stdin});
      const res = call('httpRequest','POST', PISTON+'/execute', payload);
      if(!res.ok){ out.innerHTML='<span class="log-err">HTTP '+(res.status||'')+' '+esc(res.body||res.error||'')+'</span>'; return; }
      const data = JSON.parse(res.body);
      let html='';
      if(data.compile && data.compile.stderr) html+='<div class="log-warn">[compile]\n'+esc(data.compile.stderr)+'</div>';
      const run = data.run||{};
      if(run.stdout) html+='<div>'+esc(run.stdout)+'</div>';
      if(run.stderr) html+='<div class="log-err">'+esc(run.stderr)+'</div>';
      html+='<div class="log-info">— exit '+(run.code!=null?run.code:'?')+' ・ '+esc(lang)+' '+esc(ver)+'</div>';
      out.innerHTML = html || '<span class="log-info">(出力なし)</span>';
    }catch(err){ out.innerHTML='<span class="log-err">'+esc(String(err))+'</span>'; }
  },20);
}
async function doRunLocal(){
  const out = $('runOut'); out.innerHTML='<span class="spin"></span> ローカル実行中…';
  let code = window._runCode;
  const isTs = /typescript/.test(window._runLang);
  try{
    if(isTs){
      if(!B.isOnline()){ out.innerHTML='<span class="log-err">TypeScript のローカル実行にはトランスパイル用のネット接続が必要です。</span>'; return; }
      await loadScript('https://cdn.jsdelivr.net/npm/typescript@5.6.3/lib/typescript.min.js','ts');
      code = window.ts.transpileModule(code,{compilerOptions:{target:window.ts.ScriptTarget.ES2019}}).outputText;
    }
    runInSandbox(code, out);
  }catch(err){ out.innerHTML='<span class="log-err">'+esc(String(err))+'</span>'; }
}
function runInSandbox(code, out){
  out.textContent='';
  const iframe = document.createElement('iframe');
  iframe.style.display='none'; iframe.sandbox='allow-scripts';
  const html = `<script>
    const send=(t,a)=>parent.postMessage({__run:1,type:t,msg:Array.from(a).map(x=>{try{return typeof x==='object'?JSON.stringify(x):String(x)}catch(e){return String(x)}}).join(' ')},'*');
    ['log','info','warn','error'].forEach(k=>{const o=console[k];console[k]=function(){send(k,arguments);o&&o.apply(console,arguments)};});
    window.onerror=(m,s,l,c)=>{send('error',[m+' (line '+l+')']);return true;};
    (async()=>{ try{ ${code}\n }catch(e){ send('error',[e&&e.stack||e]); } send('__done',['']); })();
  <\/script>`;
  const handler = ev=>{
    const d=ev.data; if(!d||!d.__run) return;
    if(d.type==='__done'){ window.removeEventListener('message',handler); setTimeout(()=>iframe.remove(),100);
      if(!out.textContent) out.innerHTML='<span class="log-info">(出力なし・完了)</span>'; return; }
    const cls = d.type==='error'?'log-err':d.type==='warn'?'log-warn':d.type==='info'?'log-info':'';
    const line=document.createElement('div'); if(cls)line.className=cls; line.textContent=d.msg; out.appendChild(line);
  };
  window.addEventListener('message',handler);
  iframe.srcdoc=html; document.body.appendChild(iframe);
}

function pickFmt(el){

function pickFmtNote(){
  const n=$('cNote');
  if(window._cfmt==='rar') n.innerHTML='<span class="log-warn">⚠️ RAR は独自形式のため作成できません（解凍のみ対応）。</span>';
  else if(window._cfmt==='gz') n.textContent='単一ファイルは .gz、複数選択時は自動的に .tar.gz になります。';
  else if(window._cfmt!=='zip' && window._cfmt!=='jar') n.innerHTML='<span class="log-info">パスワードは zip のみ有効です（この形式では無視されます）。</span>';
  else n.textContent='選択した項目をまとめて圧縮します。';
}
function doCompress(){
  const name=($('cName').value||'archive').trim();
  const pw=($('cPw')?$('cPw').value:'')||'';
  const paths=JSON.stringify([...selected]);
  toast('圧縮中…');
  setTimeout(()=>{
    const r=call('compress', paths, cwd, name, window._cfmt, pw);
    if(r.ok){ toast('圧縮完了: '+r.name+(pw&&(window._cfmt==='zip'||window._cfmt==='jar')?' 🔐':'')); closeSheet(); clearSelect(); refresh(); }
    else toast('圧縮失敗: '+r.error);
  },30);
}

/* ---------- 選択モード ---------- */
function toggleSelect(){
  if(!cwd){ toast('フォルダを開いてから選択してください'); return; }
  selectMode=!selectMode; if(!selectMode) selected.clear();
  updateSelUI(); refreshChecks();
}
function toggleSel(i){ const p=entries[i].path; if(selected.has(p))selected.delete(p);else selected.add(p); refreshChecks(); updateSelUI(); }
function clearSelect(){ selected.clear(); selectMode=false; updateSelUI(); refreshChecks(); }
function refreshChecks(){
  entries.forEach((e,i)=>{
    const chk=$('chk'+i), row=$('row'+i); if(!chk||!row) return;
    chk.style.display = selectMode? 'flex':'none';
    const on = selected.has(e.path);
    chk.classList.toggle('on', on); chk.textContent = on?'✓':'';
    row.classList.toggle('sel', on);
  });
}
function updateSelUI(){
  $('selbar').classList.toggle('show', selectMode);
  $('selBtn').textContent = selectMode? '✕ 選択解除':'☑️ 選択';
  $('selCount').textContent = selected.size? (selected.size+'件'):'';
}
function shareSelected(){ if(selected.size!==1){ toast('共有は1件ずつ選択してください'); return; } shareOne([...selected][0]); }
function deleteSelected(){
  if(!selected.size) return;
  if(!confirm(selected.size+'件を削除しますか?')) return;
  let ok=0; for(const p of selected){ if(call('delete',p).ok) ok++; }
  toast(ok+'件削除しました'); clearSelect(); refresh();
}

/* ---------- 作成/リネーム/コピー/削除/共有 ---------- */
function promptNewFile(){
  openSheet(`<h3>📄 ファイルを追加</h3>
    <div class="body">
      <div class="field"><label>ファイル名 (拡張子込み)</label>
        <input id="nfName" placeholder="例: memo.txt / index.html / script.js"></div>
      <div class="field"><label>初期内容 (任意)</label>
        <textarea id="nfBody" style="min-height:22vh"></textarea></div>
    </div>
    <div class="foot">
      <button class="btn" onclick="closeSheet()">キャンセル</button>
      <button class="btn pri" onclick="doNewFile()">作成</button>
    </div>`, true);
  setTimeout(()=>$('nfName').focus(),100);
}
function doNewFile(){
  const name=$('nfName').value.trim(); if(!name){ toast('名前を入力してください'); return; }
  const r=call('createFile', cwd, name, $('nfBody').value||'');
  if(r.ok){ toast('作成: '+r.name); closeSheet(); refresh(); } else toast(r.error);
}
function promptNewFolder(){
  const name=prompt('新しいフォルダ名'); if(!name) return;
  const r=call('createDir', cwd, name.trim());
  if(r.ok){ toast('作成しました'); refresh(); } else toast(r.error);
}
function renameDialog(path,name){
  openSheet(`<h3>✏️ 名前/拡張子の変更</h3>
    <div class="body">
      <div class="field"><label>新しい名前 (拡張子を変えると形式変換扱い)</label>
        <input id="rnName" value="${esc(name)}"></div>
      <p class="sub">例: notes.md → notes.txt / app.zip → app.apk</p>
    </div>
    <div class="foot"><button class="btn" onclick="closeSheet()">キャンセル</button>
      <button class="btn pri" onclick="doRename(${q(path)})">変更</button></div>`, true);
}
function doRename(path){
  const nn=$('rnName').value.trim(); if(!nn) return;
  const r=call('rename', path, nn);
  if(r.ok){ toast('変更しました'); closeSheet(); refresh(); } else toast(r.error);
}
function copyDialog(path,name){
  const nn=prompt('コピー先のファイル名', 'copy_'+name); if(!nn) return;
  const r=call('copyTo', path, cwd+'/'+nn.trim());
  if(r.ok){ toast('コピーしました'); refresh(); } else toast(r.error);
}
function confirmDelete(path){ if(confirm('削除しますか?\n'+path)){ const r=call('delete',path); if(r.ok){toast('削除しました');closeSheet();refresh();}else toast(r.error);} }
function shareOne(path){ B.shareFile(path, ''); }

/* ---------- 検索 ---------- */
function openSearch(){
  if(!cwd){ toast('フォルダを開いてから検索してください'); return; }
  openSheet(`<h3>🔍 検索</h3>
    <div class="body">
      <p class="sub">現在のフォルダ以下を再帰的に検索します。<br>${esc(cwd)}</p>
      <div class="field"><input id="sqQ" placeholder="ファイル名 (部分一致)" autofocus></div>
      <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)">
        <input type="checkbox" id="sqC" style="width:auto"> テキストファイルの中身も検索</label>
      <div id="sqRes" style="margin-top:10px"></div>
    </div>
    <div class="foot"><button class="btn" onclick="closeSheet()">閉じる</button>
      <button class="btn pri" onclick="doSearch()">🔍 検索</button></div>`, true);
  setTimeout(()=>{ const el=$('sqQ'); if(el){ el.focus(); el.onkeydown=ev=>{if(ev.key==='Enter')doSearch();}; } },100);
}
function doSearch(){
  const q=$('sqQ').value.trim(); if(!q){ toast('検索語を入力'); return; }
  const c=$('sqC').checked;
  $('sqRes').innerHTML='<div class="empty" style="padding:20px"><span class="spin"></span> 検索中…</div>';
  setTimeout(()=>{
    const r=call('search', cwd, q, c, 500);
    if(!r.ok){ $('sqRes').innerHTML='<div class="log-err">'+esc(r.error)+'</div>'; return; }
    if(!r.results.length){ $('sqRes').innerHTML='<div class="empty">一致なし</div>'; return; }
    let h=`<div class="sub" style="margin-bottom:6px">${r.count}件${r.count>=500?'+ (上限)':''}</div>`;
    h+=r.results.map(e=>`<div class="row" onclick="closeSheet();openFromSearch(${q(e.path)},${e.isDir})">
      <div class="ico">${e.isDir?'📁':iconFor(e.ext,e.name)}</div>
      <div class="meta"><div class="name">${esc(e.name)}</div>
      <div class="sub">${esc(e.path.substring(0, e.path.length-e.name.length))}</div></div></div>`).join('');
    $('sqRes').innerHTML=h;
  },20);
}
function openFromSearch(path, isDir){
  if(isDir){ navTo(path); }
  else { const dir=path.substring(0,path.lastIndexOf('/')); navTo(dir);
    setTimeout(()=>{ const e=(rawEntries||[]).find(x=>x.path===path); if(e) onTap(entries.indexOf(e)); },120); }
}

/* ---------- 並び替え / 隠しファイル ---------- */
function openSortMenu(){
  const opt=(k,l)=>`<div class="opt" onclick="setSort('${k}')"><div class="oi">${sortKey===k?'●':'○'}</div><div>${l}</div></div>`;
  openSheet(`<h3>↕️ 並び替え</h3><div class="body">
    ${opt('name','名前')}${opt('size','サイズ')}${opt('mtime','更新日時')}${opt('ext','拡張子')}
    <div class="opt" onclick="setSortDir()"><div class="oi">${sortAsc?'⬆️':'⬇️'}</div><div>${sortAsc?'昇順':'降順'} (タップで切替)</div></div>
    </div><div class="foot"><button class="btn pri" onclick="closeSheet()">完了</button></div>`);
}
function setSort(k){ sortKey=k; localStorage.setItem('sortKey',k); renderList(); openSortMenu(); }
function setSortDir(){ sortAsc=!sortAsc; localStorage.setItem('sortAsc', sortAsc?'1':'0'); renderList(); openSortMenu(); }
function renderList(){ // 現在の rawEntries を再描画 (再リストせず)
  entries=applyView(rawEntries);
  const listEl=$('list');
  if(!entries.length){ listEl.innerHTML='<div class="empty">📭 空のフォルダ</div>'; return; }
  let h='';
  entries.forEach((e,i)=>{
    const icon = e.isDir? '📁' : iconFor(e.ext, e.name);
    const sub = e.isDir? 'フォルダ' : (fmtSize(e.size)+' ・ '+fmtDate(e.mtime));
    h += `<div class="row" id="row${i}" onclick="onTap(${i})">
      <div class="check" id="chk${i}" style="display:none"></div>
      <div class="ico">${icon}</div>
      <div class="meta"><div class="name">${esc(e.name)}</div><div class="sub">${sub}</div></div>
      <button class="btn sm" onclick="event.stopPropagation();openItemMenu(${i})">⋮</button>
    </div>`;
  });
  listEl.innerHTML=h; refreshChecks();
}
function toggleHidden(){ showHidden=!showHidden; localStorage.setItem('showHidden', showHidden?'1':'0');
  $('hidBtn').textContent = showHidden?'🙈 隠す':'👁 隠し'; renderList(); }

/* ---------- 整理 (クリーンアップ) ---------- */
function openTools(){
  if(!cwd){ toast('フォルダを開いてから実行してください'); return; }
  const opt=(ico,l,fn)=>`<div class="opt" onclick="${fn}"><div class="oi">${ico}</div><div>${l}</div></div>`;
  openSheet(`<h3>🧹 整理ツール</h3><div class="body">
    <p class="sub">対象: ${esc(cwd)} 以下</p>
    ${opt('0️⃣','0バイトのファイルを削除',`cleanupEmpty()`)}
    ${opt('📂','空のフォルダを削除',`cleanupEmptyDirs()`)}
    ${opt('👯','重複ファイルを検索',`findDup()`)}
    </div><div class="foot"><button class="btn" onclick="closeSheet()">閉じる</button></div>`);
}
function cleanupEmpty(){
  if(!confirm(cwd+' 以下の 0 バイトファイルをすべて削除しますか?')) return;
  const r=call('deleteEmptyFiles', cwd, true);
  if(r.ok){ toast(r.message); closeSheet(); refresh(); } else toast(r.error);
}
function cleanupEmptyDirs(){
  if(!confirm(cwd+' 以下の空フォルダをすべて削除しますか?')) return;
  const r=call('deleteEmptyDirs', cwd);
  if(r.ok){ toast(r.message); closeSheet(); refresh(); } else toast(r.error);
}
function findDup(){
  toast('検索中…');
  setTimeout(()=>{
    const r=call('findDuplicates', cwd, 3000);
    if(!r.ok){ toast(r.error); return; }
    if(!r.groups){ openSheet(`<h3>👯 重複ファイル</h3><div class="body"><div class="empty">重複は見つかりませんでした</div></div>
      <div class="foot"><button class="btn pri" onclick="closeSheet()">閉じる</button></div>`); return; }
    let h='';
    r.groups.forEach((g,gi)=>{
      h+=`<div style="margin:12px 0;border:1px solid var(--line);border-radius:10px;padding:10px">
        <div class="sub">同一内容 ${g.files.length}件 ・ ${fmtSize(g.size)} × ${g.files.length}</div>`;
      g.files.forEach((p,pi)=>{
        h+=`<div style="display:flex;gap:8px;align-items:center;margin-top:6px">
          <div class="name" style="flex:1;font-size:12px;word-break:break-all">${esc(p)}</div>
          ${pi>0?`<button class="btn dan sm" onclick="delDup(${q(p)})">削除</button>`:'<span class="badge lo">原本</span>'}
        </div>`;
      });
      h+='</div>';
    });
    openSheet(`<h3>👯 重複ファイル (${r.groups}組)</h3><div class="body">
      <p class="sub">各組の先頭を原本として残し、他を削除できます。</p>${h}</div>
      <div class="foot"><button class="btn pri" onclick="closeSheet()">閉じる</button></div>`, true);
  },20);
}
function delDup(path){ if(!confirm('削除しますか?\n'+path)) return; const r=call('delete',path);
  if(r.ok){ toast('削除しました'); findDup(); } else toast(r.error); }

/* ---------- ブックマーク ---------- */
function toggleBookmark(){
  if(!cwd){ toast('フォルダを開いてから登録してください'); return; }
  const i=bookmarks.indexOf(cwd);
  if(i>=0){ bookmarks.splice(i,1); toast('ブックマーク解除'); }
  else { bookmarks.push(cwd); toast('ブックマークに追加'); }
  localStorage.setItem('bookmarks', JSON.stringify(bookmarks));
  updateBookmarkBtn();
}
function updateBookmarkBtn(){ const b=$('bmBtn'); if(b) b.textContent = (cwd && bookmarks.includes(cwd))?'★ 登録済':'☆ 登録'; }

/* ---------- 詳細 / ハッシュ ---------- */
function showDetails(path){
  const r=call('stat', path);
  if(!r.ok){ toast(r.error); return; }
  openSheet(`<h3>ℹ️ 詳細</h3><div class="body">
    <div class="kv"><span class="k">名前</span><span>${esc(r.name)}</span></div>
    <div class="kv"><span class="k">種類</span><span>${r.isDir?'フォルダ':(r.ext||'ファイル')}</span></div>
    <div class="kv"><span class="k">パス</span><span style="word-break:break-all;text-align:right">${esc(r.path)}</span></div>
    ${r.isDir?`<div class="kv"><span class="k">子要素</span><span>${r.children}</span></div>`
      :`<div class="kv"><span class="k">サイズ</span><span>${fmtSize(r.size)} (${r.size} B)</span></div>`}
    <div class="kv"><span class="k">更新</span><span>${fmtDate(r.mtime)}</span></div>
    <div class="kv"><span class="k">権限</span><span>${r.canRead?'r':'-'}${r.canWrite?'w':'-'} ${r.hidden?'・隠し':''}</span></div>
    ${r.isDir?'':`<div class="field" style="margin-top:12px">
      <button class="btn sm" onclick="computeHash(${q(path)},'MD5')">MD5 を計算</button>
      <button class="btn sm" onclick="computeHash(${q(path)},'SHA-256')">SHA-256 を計算</button>
      <pre class="out" id="hashOut" style="margin-top:8px;display:none"></pre></div>`}
    </div><div class="foot"><button class="btn pri" onclick="closeSheet()">閉じる</button></div>`, true);
}
function computeHash(path, algo){
  const o=$('hashOut'); o.style.display='block'; o.innerHTML='<span class="spin"></span> 計算中…';
  setTimeout(()=>{ const r=call('hashFile', path, algo);
    o.textContent = r.ok? (algo+': '+r.hash) : ('エラー: '+r.error); },20);
}

/* ---------- 移動/コピー先の選択 ---------- */
function pickDest(mode){
  if(!selected.size){ toast('対象を選択してください'); return; }
  window._destMode=mode; window._destPaths=[...selected]; window._destCwd=cwd;
  browseDest(cwd);
}
function browseDest(dir){
  const r=call('list', dir);
  if(!r.ok){ toast(r.error); return; }
  const folders=r.entries.filter(e=>e.isDir);
  let h=folders.map(e=>`<div class="row" onclick="browseDest(${q(e.path)})">
    <div class="ico">📁</div><div class="meta"><div class="name">${esc(e.name)}</div></div><div class="chev">›</div></div>`).join('');
  if(!folders.length) h='<div class="empty">サブフォルダなし</div>';
  const up = r.parent? `<button class="btn sm" onclick="browseDest(${q(r.parent)})">⬆️ 上へ</button>`:'';
  openSheet(`<h3>${window._destMode==='move'?'📦 移動':'📄 コピー'}先を選択</h3>
    <div class="body"><p class="sub">${esc(dir)}</p>${up}
      <div style="margin-top:8px">${h}</div></div>
    <div class="foot"><button class="btn" onclick="closeSheet()">キャンセル</button>
      <button class="btn pri" onclick="doDest(${q(dir)})">ここに${window._destMode==='move'?'移動':'コピー'}</button></div>`, true);
}
function doDest(dir){
  const mode=window._destMode, paths=window._destPaths;
  let ok=0, ng=0;
  for(const p of paths){
    const r = mode==='move'? call('moveTo', p, dir) : call('copyTo', p, dir+'/'+p.split('/').pop());
    if(r.ok) ok++; else ng++;
  }
  toast(`${mode==='move'?'移動':'コピー'}: 成功${ok} 失敗${ng}`);
  closeSheet(); clearSelect(); refresh();
}

/* ---------- モーダル/トースト ---------- */
function openSheet(html, full){
  $('sheet').className = 'sheet'+(full?' full':'');
  $('sheet').innerHTML = html;
  $('modal').classList.add('show');
}
function closeSheet(){ $('modal').classList.remove('show'); $('sheet').innerHTML=''; }
$('modal').addEventListener('click', ev=>{ if(ev.target.id==='modal') closeSheet(); });
window.toast = toast;
let toastT;
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2200); }

/* ---------- 補助 ---------- */
function refresh(){ if(cwd){ const r=call('list',cwd); if(r.ok) render(r,true); } else showRoots(); }
function dirOf(p){ return p.substring(0,p.lastIndexOf('/'))||'/'; }
function q(s){ return "'"+String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'")+"'"; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function isText(ext,name){
  return ['txt','md','markdown','json','xml','csv','tsv','log','ini','cfg','conf','properties','yml','yaml',
    'js','mjs','cjs','ts','jsx','tsx','html','htm','css','scss','less','java','kt','kts','c','h','cpp','hpp','cc',
    'py','rb','go','rs','php','sh','bash','bat','gradle','pro','sql','svg','env','gitignore','toml','lua','pl','r','swift']
    .includes(ext) || !name.includes('.');
}
function isImage(ext){ return ['png','jpg','jpeg','gif','webp','bmp','svg','ico'].includes(ext); }
function isArchive(ext){ return ['zip','7z','tar','gz','tgz','rar','jar','xz','bz2'].includes(ext); }
function iconFor(ext,name){
  if(isImage(ext)) return '🖼️';
  if(isArchive(ext)) return '📦';
  if(ext==='apk') return '🤖';
  if(['mp4','mkv','webm','avi','mov'].includes(ext)) return '🎬';
  if(['mp3','wav','flac','ogg','m4a'].includes(ext)) return '🎵';
  if(ext==='pdf') return '📕';
  if(['js','mjs','ts','jsx','tsx'].includes(ext)) return '📜';
  if(['html','htm'].includes(ext)) return '🌐';
  if(['json','xml','yml','yaml','csv'].includes(ext)) return '🗃️';
  if(['md','markdown','txt'].includes(ext)) return '📝';
  return '📄';
}
function fmtSize(b){ b=Number(b)||0; if(b<1024)return b+' B'; const u=['KB','MB','GB','TB']; let i=-1;
  do{ b/=1024; i++; }while(b>=1024&&i<u.length-1); return b.toFixed(b<10?1:0)+' '+u[i]; }
function fmtDate(ms){ if(!ms)return''; const d=new Date(Number(ms));
  const p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; }
function loadScript(src,flag){ return new Promise((res,rej)=>{ if(window[flag]) return res(window[flag]);
  const s=document.createElement('script'); s.src=src; s.onload=()=>res(window[flag]); s.onerror=()=>rej(new Error('読み込み失敗: '+src)); document.head.appendChild(s); }); }
</script>
