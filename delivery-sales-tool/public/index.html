<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>配達員 営業リスト作成ツール</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛵</text></svg>" />
<link rel="stylesheet" href="./style.css" />
</head>
<body>
<header class="topbar">
  <h1>🛵 配達員 営業リスト作成ツール <span class="tag">MVP</span></h1>
  <div id="status" class="status"></div>
</header>

<main>
  <!-- ── 検索条件パネル ── -->
  <section class="panel">
    <h2>検索・抽出条件</h2>
    <div class="grid">
      <label class="field wide">
        <span>収集キーワード（1行に1つ）</span>
        <textarea id="keywords" rows="6" placeholder="ロケットナウ&#10;Uber Eats&#10;出前館&#10;配達員"></textarea>
      </label>
      <label class="field wide">
        <span>地域フィルタ（1行に1つ・空なら全地域）</span>
        <textarea id="regions" rows="6" placeholder="大阪&#10;東京&#10;神奈川"></textarea>
      </label>
      <label class="field">
        <span>収集件数の上限</span>
        <input id="maxResults" type="number" min="10" max="100" />
      </label>
      <label class="field">
        <span>営業対象の最小スコア（0-100）</span>
        <input id="minScore" type="number" min="0" max="100" />
      </label>
      <label class="field">
        <span>自社サービス名</span>
        <input id="ourService" type="text" />
      </label>
      <label class="field wide">
        <span>自社の訴求ポイント（DM生成に使用）</span>
        <input id="ourPitch" type="text" />
      </label>
      <label class="checkbox"><input id="langJa" type="checkbox" /> 日本語の投稿のみ</label>
      <label class="checkbox"><input id="excludeRetweets" type="checkbox" /> リツイートを除外</label>
    </div>
    <div class="actions">
      <button id="runBtn" class="primary">🔍 検索・抽出を実行</button>
      <button id="saveBtn">条件を保存</button>
      <button id="clearBtn" class="ghost">一覧をクリア</button>
      <span id="runMeta" class="meta"></span>
    </div>
  </section>

  <!-- ── 候補者一覧 ── -->
  <section class="panel">
    <div class="list-head">
      <h2>候補者一覧 <span id="count" class="count"></span></h2>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <input id="filterBox" type="search" placeholder="名前・地域・投稿で絞り込み" />
        <button id="exportBtn" class="ghost">📊 Excel用に出力(CSV)</button>
      </div>
    </div>
    <div class="table-wrap">
      <table id="table">
        <thead>
          <tr>
            <th>スコア</th>
            <th>アカウント</th>
            <th>投稿</th>
            <th>フォロワー</th>
            <th>推定地域</th>
            <th>利用サービス</th>
            <th>AI判定理由</th>
            <th>DM</th>
            <th>状態</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <p id="empty" class="empty">まだ候補者がいません。上の「検索・抽出を実行」を押してください。</p>
  </section>
</main>

<!-- ── DM モーダル ── -->
<div id="modal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head">
      <h3 id="modalTitle">営業DM文章</h3>
      <button id="modalClose" class="ghost">✕</button>
    </div>
    <textarea id="dmText" rows="8"></textarea>
    <div class="modal-actions">
      <button id="dmRegen">🤖 AIで再生成</button>
      <button id="dmCopy" class="primary">📋 コピー</button>
      <button id="dmSaveSend">保存して「送信済み」にする</button>
    </div>
    <p class="note">※ Xへの送信は自動化しません。文章をコピーして手動で送信してください。</p>
  </div>
</div>

<script src="./app.js"></script>
</body>
</html>
