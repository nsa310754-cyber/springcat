function b64(s){ return Uint8Array.from(atob(s), function(c){ return c.charCodeAt(0) }) }
async function dec(pw, B){
  var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey'])
  var key = await crypto.subtle.deriveKey({ name:'PBKDF2', salt:b64(B.s), iterations:B.it, hash:'SHA-256' }, base, { name:'AES-GCM', length:256 }, false, ['decrypt'])
  return new TextDecoder().decode(await crypto.subtle.decrypt({ name:'AES-GCM', iv:b64(B.i) }, key, b64(B.d)))
}
document.getElementById('f').onsubmit = async function(e){
  e.preventDefault(); var m = document.getElementById('m'); m.textContent = '開いています…'; m.style.color='#94a3b8';
  try {
    var html = await dec(document.getElementById('p').value, B)
    document.open(); document.write(html); document.close()
  } catch(err){ m.textContent = 'パスワードが違います'; m.style.color='#f87171'; }
}
