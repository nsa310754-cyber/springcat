spring.application.name=springcat

# --- File upload limits (support files up to 1.5GB) ---
# 1.5GB = 1536MB. max-request-size adds headroom for multipart overhead
# and any additional form fields sent alongside the file.
spring.servlet.multipart.max-file-size=1536MB
spring.servlet.multipart.max-request-size=1600MB

# Do not buffer uploads fully in memory; stream to disk immediately.
spring.servlet.multipart.file-size-threshold=2KB

# Allow Tomcat to swallow (drain) the whole request body even when the
# limit is exceeded, so the client receives the 4xx error instead of a
# connection reset. -1 means unlimited.
server.tomcat.max-swallow-size=-1

# Only applies to non-multipart form POST bodies; -1 disables the cap.
server.tomcat.max-http-form-post-size=-1

# Directory where completed uploads are stored.
springcat.upload.dir=${java.io.tmpdir}/springcat-uploads
