<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>OshiLog</title>
<style>
  :root{
    --ink:#4a4458; --ink-soft:#7c7690; --ink-faint:#9a94ac;
    --purple:#9a80d8; --purple-deep:#7b62c6;
    --pink:#ff3d8b; --pink-deep:#f5227d;
    --bg:#f6f0fb; --card:#ffffff; --line:#f0eaf8; --field:#f7f2fc;
    --nav-h:64px;
    --font:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,-apple-system,"Segoe UI",Meiryo,sans-serif;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; }
  body{
    font-family:var(--font); color:var(--ink); line-height:1.6;
    background:linear-gradient(180deg,#f7f1fc 0%,#f1e9f9 100%);
    -webkit-font-smoothing:antialiased; overscroll-behavior:none;
    -webkit-user-select:none; user-select:none;
  }
  .app{ height:100%; display:flex; flex-direction:column; max-width:520px; margin:0 auto; position:relative; }

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:calc(env(safe-area-inset-top) + 12px) 18px 12px;
    font-size:18px; font-weight:800; color:#3f3a4a; flex:0 0 auto;
    background:rgba(247,241,252,.85); backdrop-filter:blur(8px);
    position:sticky; top:0; z-index:5;
  }
  .topbar .ic{ font-size:20px; color:#8a83a0; width:26px; text-align:center; }
  .topbar .title{ flex:1; text-align:center; }

  .scroll{ flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:6px 16px calc(var(--nav-h) + env(safe-area-inset-bottom) + 20px); }
  .screen{ display:none; }
  .screen.active{ display:block; animation:fade .22s ease; }
  @keyframes fade{ from{ opacity:0; transform:translateY(6px) } to{ opacity:1; transform:none } }

  .card{ background:var(--card); border-radius:18px; padding:14px 15px; box-shadow:0 6px 20px rgba(120,90,180,.08); margin-bottom:12px; }
  .row{ display:flex; align-items:center; }
  .between{ justify-content:space-between; }
  .lbl{ font-size:12px; color:var(--ink-faint); font-weight:700; }
  .seeall{ font-size:11px; color:#b3aac6; font-weight:700; cursor:pointer; }
  .sec-h{ display:flex; justify-content:space-between; align-items:center; margin:14px 2px 8px; }
  .sec-h .lbl{ font-size:13px; }
  .empty{ color:var(--ink-faint); font-size:13px; text-align:center; padding:16px 8px; }
  .empty .add-link{ color:var(--purple-deep); font-weight:700; cursor:pointer; }

  /* HOME */
  .money-card{ background:linear-gradient(120deg,#efe8fb,#e9e0f8); display:flex; align-items:center; gap:12px; }
  .money-ic{ width:40px;height:40px;border-radius:12px;background:#fff;display:grid;place-items:center;font-size:20px;box-shadow:0 3px 8px rgba(120,90,180,.16);flex:0 0 auto; }
  .money-card .val{ font-size:26px; font-weight:800; line-height:1.15; white-space:nowrap; }
  .spark{ margin-left:auto; display:flex; gap:3px; align-items:flex-end; height:34px; }
  .spark i{ width:6px; background:#b9a6ec; border-radius:3px; display:block; min-height:3px; }
  .duo{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px; }
  .duo .card{ margin:0; }
  .duo .ic{ font-size:20px; }
  .duo .big{ font-size:26px; font-weight:800; }
  .duo .big small{ font-size:14px; }
  .pinkbg{ background:#fdeef4; } .lavbg{ background:#f1ecfb; }
  .thumb{ width:52px;height:52px;border-radius:12px;flex:0 0 auto;position:relative;overflow:hidden;display:grid;place-items:center;color:#fff;font-size:24px; }
  .ev-row{ display:flex; align-items:center; gap:12px; cursor:pointer; }
  .ev-title{ font-size:15px; font-weight:800; }
  .ev-sub{ font-size:12px; color:var(--ink-faint); }
  .chev{ margin-left:auto; color:#c8c1da; font-size:20px; }
  .win{ color:var(--pink); font-weight:800; }
  .lost{ color:var(--ink-faint); font-weight:800; }
  .applied{ color:var(--purple-deep); font-weight:800; }

  /* CALENDAR */
  .cal-nav{ display:flex; align-items:center; justify-content:center; gap:20px; font-size:16px; font-weight:800; padding:6px 0 12px; }
  .cal-nav button{ border:0; background:none; font-size:20px; color:#b7aecd; cursor:pointer; padding:4px 10px; }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px 0; text-align:center; }
  .cal-grid .wd{ font-size:12px; font-weight:700; color:var(--ink-faint); padding-bottom:5px; }
  .cal-grid .wd.sun{ color:#e690b3; } .cal-grid .wd.sat{ color:#8fa8e0; }
  .cal-grid .d{ font-size:14px; color:#5c5670; padding:5px 0; cursor:pointer; }
  .cal-grid .d.blank{ cursor:default; }
  .cal-grid .d .num{ display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%; margin:0 auto; }
  .cal-grid .d.today .num{ box-shadow:inset 0 0 0 2px var(--purple); }
  .cal-grid .d.sel .num{ background:#8a6fd6; color:#fff; font-weight:700; }
  .cal-grid .d .dots{ display:flex;gap:3px;justify-content:center;margin-top:2px;height:5px; }
  .cal-grid .d .dots i{ width:5px;height:5px;border-radius:50%;background:#c9a8ef; } .cal-grid .d .dots i.p{ background:var(--pink); }
  .cal-item{ display:flex; align-items:center; gap:12px; cursor:pointer; }
  .cal-ic{ width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:0 0 auto;color:#fff; }
  .cal-date{ font-size:12px;color:var(--ink-faint);font-weight:700; }
  .cal-name{ font-size:15px;font-weight:800; } .cal-place{ font-size:12px;color:#b3aac6; }

  /* RECORD */
  .rec-total{ display:flex; align-items:baseline; gap:10px; margin:4px 0 8px; flex-wrap:wrap; }
  .rec-total .n{ font-size:30px; font-weight:800; white-space:nowrap; }
  .badge-up{ background:#fde6ef; color:var(--pink-deep); font-size:12px; font-weight:800; padding:3px 10px; border-radius:20px; white-space:nowrap; }
  .badge-down{ background:#e8f0ff; color:#5f7fd0; font-size:12px; font-weight:800; padding:3px 10px; border-radius:20px; white-space:nowrap; }
  .chart{ display:flex; align-items:flex-end; gap:3px; height:120px; padding:8px 0 6px; border-bottom:1px solid var(--line); }
  .chart i{ flex:1; border-radius:4px 4px 0 0; background:linear-gradient(180deg,#c9a8ef,#a98fe6); min-height:2px; }
  .chart-x{ display:flex; justify-content:space-between; font-size:11px; color:#b3aac6; padding-top:6px; }
  .rec-item{ display:flex; justify-content:space-between; align-items:center; padding:13px 2px; border-bottom:1px solid var(--line); font-size:15px; }
  .rec-item:last-child{ border-bottom:0; }
  .rec-item .k{ color:#5c5670; font-weight:700; display:flex; align-items:center; gap:10px; }
  .rec-item .dot{ width:10px;height:10px;border-radius:50%;flex:0 0 auto; }
  .rec-item .v{ font-weight:800; }
  .exp-item{ cursor:pointer; }

  /* MYPAGE */
  .prof{ display:flex; align-items:center; gap:14px; }
  .avatar{ width:60px;height:60px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#fff,#f3e3f2);display:grid;place-items:center;font-size:30px;box-shadow:inset 0 0 0 3px rgba(255,255,255,.6);flex:0 0 auto; }
  .prof .name{ font-size:18px; font-weight:800; }
  .prof .sub{ font-size:12px; color:var(--ink-faint); }
  .oshi-chip{ display:flex; align-items:center; gap:10px; padding:11px 4px; border-bottom:1px solid var(--line); cursor:pointer; }
  .oshi-chip:last-child{ border-bottom:0; }
  .oshi-badge{ width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:19px;color:#fff;flex:0 0 auto; }
  .oshi-chip .nm{ font-weight:700; font-size:15px; }
  .menu-item{ display:flex; align-items:center; gap:14px; padding:15px 4px; border-bottom:1px solid var(--line); font-size:15px; font-weight:600; cursor:pointer; }
  .menu-item:last-child{ border-bottom:0; }
  .menu-item .mi{ font-size:20px; width:26px; text-align:center; }
  .menu-item .chev{ margin-left:auto; font-size:18px; }
  .btn-add-inline{ display:inline-flex; align-items:center; gap:6px; color:var(--purple-deep); font-weight:800; font-size:13px; cursor:pointer; }

  /* bottom nav */
  .nav{
    position:absolute; left:0; right:0; bottom:0; height:calc(var(--nav-h) + env(safe-area-inset-bottom));
    padding-bottom:env(safe-area-inset-bottom);
    display:flex; align-items:center; justify-content:space-around;
    background:#fff; border-top:1px solid var(--line);
    box-shadow:0 -4px 20px rgba(120,90,180,.08); z-index:6;
  }
  .nav .tab{ display:flex; flex-direction:column; align-items:center; gap:3px; font-size:11px; color:#b3aac6; font-weight:700; border:0; background:none; cursor:pointer; flex:1; padding:8px 0; }
  .nav .tab .ni{ font-size:22px; line-height:1; }
  .nav .tab.active{ color:var(--purple-deep); }
  .nav .fab{ width:56px;height:56px;border-radius:50%;background:var(--pink);color:#fff;display:grid;place-items:center;font-size:30px;line-height:1;margin-top:-22px;box-shadow:0 8px 18px rgba(255,61,139,.45);border:0;cursor:pointer;flex:0 0 auto; }
  .nav .fab:active{ transform:scale(.94); }

  /* sheet + modal */
  .ov-bg{ position:absolute; inset:0; background:rgba(60,45,90,.4); opacity:0; pointer-events:none; transition:opacity .2s; z-index:20; }
  .ov-bg.show{ opacity:1; pointer-events:auto; }
  .sheet{ position:absolute; left:0; right:0; bottom:0; background:#fff; border-radius:24px 24px 0 0; padding:8px 20px calc(env(safe-area-inset-bottom) + 24px); transform:translateY(110%); transition:transform .26s cubic-bezier(.2,.8,.2,1); z-index:21; max-height:88%; overflow-y:auto; }
  .sheet.show{ transform:none; }
  .grab{ width:40px;height:4px;border-radius:2px;background:#e2dbef;margin:8px auto 14px; }
  .sheet h3{ margin:0 0 12px; font-size:16px; text-align:center; }
  .add-opt{ display:flex; align-items:center; gap:14px; width:100%; padding:15px 12px; border:0; background:var(--field); border-radius:14px; margin-bottom:10px; font-size:15px; font-weight:700; color:var(--ink); cursor:pointer; text-align:left; }
  .add-opt .ai{ width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:#efe6fb;flex:0 0 auto; }

  /* form */
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12px; font-weight:700; color:var(--ink-soft); margin-bottom:6px; }
  .field input, .field select, .field textarea{
    width:100%; border:1px solid var(--line); background:var(--field); border-radius:12px;
    padding:12px 13px; font-size:15px; font-family:inherit; color:var(--ink); -webkit-user-select:text; user-select:text;
  }
  .field input:focus, .field select:focus, .field textarea:focus{ outline:none; border-color:var(--purple); background:#fff; }
  .field textarea{ resize:none; min-height:64px; }
  .req{ color:var(--pink); }
  .seg{ display:flex; gap:8px; }
  .seg button{ flex:1; border:1px solid var(--line); background:var(--field); border-radius:12px; padding:11px 0; font-size:14px; font-weight:700; color:var(--ink-soft); cursor:pointer; }
  .seg button.on{ background:var(--purple); color:#fff; border-color:var(--purple); }
  .swatches, .emojis{ display:flex; flex-wrap:wrap; gap:8px; }
  .swatch{ width:32px;height:32px;border-radius:50%;cursor:pointer;border:3px solid transparent; }
  .swatch.on{ border-color:#fff; box-shadow:0 0 0 2px var(--purple); }
  .emoji-pick{ width:38px;height:38px;border-radius:11px;background:var(--field);display:grid;place-items:center;font-size:20px;cursor:pointer;border:2px solid transparent; }
  .emoji-pick.on{ border-color:var(--purple); background:#fff; }
  .form-actions{ display:flex; gap:10px; margin-top:6px; }
  .btn{ flex:1; border:0; border-radius:14px; padding:14px 0; font-size:15px; font-weight:800; cursor:pointer; }
  .btn-primary{ background:var(--pink); color:#fff; box-shadow:0 6px 14px rgba(255,61,139,.35); }
  .btn-ghost{ background:var(--field); color:var(--ink-soft); }
  .btn-danger{ background:#fdeaf0; color:var(--pink-deep); flex:0 0 auto; padding:14px 18px; }
  .err{ color:var(--pink-deep); font-size:12px; font-weight:700; text-align:center; margin:0 0 8px; min-height:16px; }

  .toast{ position:absolute; left:50%; bottom:calc(var(--nav-h) + 30px); transform:translateX(-50%) translateY(20px); background:#4a4458; color:#fff; padding:10px 18px; border-radius:20px; font-size:13px; font-weight:700; opacity:0; pointer-events:none; transition:all .25s; z-index:40; white-space:nowrap; }
  .toast.show{ opacity:1; transform:translateX(-50%); }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <span class="ic" id="btnMenu">☰</span>
    <span class="title" id="topTitle">ホーム</span>
    <span class="ic" id="btnBell">🔔</span>
  </div>

  <div class="scroll" id="scroll">
    <section class="screen active" id="s-home"></section>
    <section class="screen" id="s-cal"></section>
    <section class="screen" id="s-rec"></section>
    <section class="screen" id="s-my"></section>
  </div>

  <nav class="nav">
    <button class="tab active" data-tab="home"><span class="ni">🏠</span>ホーム</button>
    <button class="tab" data-tab="cal"><span class="ni">📅</span>カレンダー</button>
    <button class="fab" id="fab" aria-label="追加">＋</button>
    <button class="tab" data-tab="rec"><span class="ni">📝</span>記録</button>
    <button class="tab" data-tab="my"><span class="ni">👤</span>マイページ</button>
  </nav>

  <div class="ov-bg" id="ovBg"></div>

  <div class="sheet" id="addSheet">
    <div class="grab"></div>
    <h3>＋ 追加する</h3>
    <button class="add-opt" data-add="event"><span class="ai">📅</span>ライブ・イベント予定</button>
    <button class="add-opt" data-add="ticket"><span class="ai">🎫</span>チケット応募・当落</button>
    <button class="add-opt" data-add="expense"><span class="ai">💰</span>推し活費の記録</button>
    <button class="add-opt" data-add="oshi"><span class="ai">💜</span>推しを登録</button>
  </div>

  <div class="sheet" id="formSheet">
    <div class="grab"></div>
    <h3 id="formTitle">追加</h3>
    <p class="err" id="formErr"></p>
    <div id="formBody"></div>
    <div class="form-actions">
      <button class="btn btn-danger" id="formDelete" style="display:none">削除</button>
      <button class="btn btn-ghost" id="formCancel">キャンセル</button>
      <button class="btn btn-primary" id="formSave">保存</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
(function(){
  "use strict";

  /* ---------- storage ---------- */
  var KEY = "oshilog:v1";
  var DEFAULT = { profile:{ name:"推し活ユーザー", emoji:"🙆‍♀️" }, oshi:[], events:[], tickets:[], expenses:[] };
  var db;
  try { db = JSON.parse(localStorage.getItem(KEY)) || null; } catch(e){ db = null; }
  if(!db){ db = JSON.parse(JSON.stringify(DEFAULT)); }
  ["oshi","events","tickets","expenses"].forEach(function(k){ if(!Array.isArray(db[k])) db[k]=[]; });
  if(!db.profile) db.profile = { name:"推し活ユーザー", emoji:"🙆‍♀️" };
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){} }
  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

  /* ---------- constants ---------- */
  var CATS = [
    { id:"ticket", name:"ライブチケット", color:"#a98fe6" },
    { id:"goods",  name:"グッズ購入",     color:"#c9a8ef" },
    { id:"travel", name:"交通費",         color:"#e0a8d8" },
    { id:"food",   name:"カフェ・飲食",   color:"#f2a6c4" },
    { id:"other",  name:"その他",         color:"#d7c6f0" }
  ];
  function catOf(id){ for(var i=0;i<CATS.length;i++){ if(CATS[i].id===id) return CATS[i]; } return CATS[4]; }
  var OSHI_COLORS = ["#9a80d8","#ff6fae","#6fb8e6","#63c7a6","#f2a65a","#e06fa0","#7ec8f0","#b98fe0"];
  var OSHI_EMOJIS = ["💜","💙","💚","💛","🧡","❤️","🩷","⭐","🌟","🎤","🎸","👑"];

  /* ---------- date utils ---------- */
  function pad(n){ return (n<10?"0":"")+n; }
  function ymd(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
  function todayStr(){ return ymd(new Date()); }
  function parseYmd(s){ var p=(s||"").split("-"); return new Date(+p[0], (+p[1]||1)-1, +p[2]||1); }
  function daysUntil(s){
    var t=new Date(); t.setHours(0,0,0,0);
    var d=parseYmd(s); d.setHours(0,0,0,0);
    return Math.round((d-t)/86400000);
  }
  var WD = ["日","月","火","水","木","金","土"];
  function jDate(s){ var d=parseYmd(s); return (d.getMonth()+1)+"/"+d.getDate()+"（"+WD[d.getDay()]+"）"; }
  function yen(n){ return (n||0).toLocaleString("ja-JP")+" 円"; }
  function monthKey(y,m){ return y+"-"+pad(m+1); }
  function inMonth(dateStr, y, m){ var d=parseYmd(dateStr); return d.getFullYear()===y && d.getMonth()===m; }

  /* ---------- oshi helpers ---------- */
  function oshiById(id){ for(var i=0;i<db.oshi.length;i++){ if(db.oshi[i].id===id) return db.oshi[i]; } return null; }
  function oshiColor(id){ var o=oshiById(id); return o?o.color:"#b19be0"; }
  function oshiEmoji(id){ var o=oshiById(id); return o?o.emoji:"🎤"; }

  /* ---------- state ---------- */
  var cur = { tab:"home", calY:new Date().getFullYear(), calM:new Date().getMonth(),
              recY:new Date().getFullYear(), recM:new Date().getMonth(), selDay:todayStr() };

  /* ---------- rendering ---------- */
  var elHome=document.getElementById("s-home"),
      elCal=document.getElementById("s-cal"),
      elRec=document.getElementById("s-rec"),
      elMy=document.getElementById("s-my");

  function esc(s){ return (s==null?"":String(s)).replace(/[&<>"]/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }

  function upcomingEvents(){
    return db.events.slice().filter(function(e){ return daysUntil(e.date)>=0; })
      .sort(function(a,b){ return a.date<b.date?-1:a.date>b.date?1:0; });
  }
  function sumMonth(y,m){ var s=0; db.expenses.forEach(function(e){ if(inMonth(e.date,y,m)) s+=(+e.amount||0); }); return s; }

  function renderHome(){
    var now=new Date(), y=now.getFullYear(), m=now.getMonth();
    var monthSpend=sumMonth(y,m);
    var up=upcomingEvents();
    var next=up[0];
    var daysTxt = next ? String(daysUntil(next.date)) : "—";
    var evCount = db.events.filter(function(e){ return inMonth(e.date,y,m); }).length;

    // spark: last 7 days spend
    var spark="";
    var maxd=1, arr=[];
    for(var i=6;i>=0;i--){ var d=new Date(); d.setDate(d.getDate()-i); var k=ymd(d); var s=0;
      db.expenses.forEach(function(e){ if(e.date===k) s+=(+e.amount||0); }); arr.push(s); if(s>maxd)maxd=s; }
    arr.forEach(function(s){ var h=Math.max(4, Math.round(s/maxd*30)); spark+='<i style="height:'+h+'px"></i>'; });

    var nextHtml;
    if(next){
      nextHtml='<div class="card"><div class="ev-row" data-edit="event" data-id="'+next.id+'">'
        +'<span class="thumb" style="background:linear-gradient(135deg,'+oshiColor(next.oshiId)+',#c9a8ef)">'+oshiEmoji(next.oshiId)+'</span>'
        +'<span><span class="ev-title">'+jDate(next.date)+'</span><br><span class="ev-title">'+esc(next.title)+'</span>'
        +(next.place?'<br><span class="ev-sub">会場：'+esc(next.place)+'</span>':'')+'</span>'
        +'<span class="chev">›</span></div></div>';
    } else {
      nextHtml='<div class="card"><div class="empty">予定はまだありません<br><span class="add-link" data-add="event">＋ 予定を追加</span></div></div>';
    }

    var tk = db.tickets.slice().sort(function(a,b){ return (a.date<b.date?1:-1); })[0];
    var tkHtml;
    if(tk){
      var st = tk.status==="won"?'<span class="win">当選🎉</span>':tk.status==="lost"?'<span class="lost">落選</span>':'<span class="applied">応募中</span>';
      tkHtml='<div class="card"><div class="ev-row" data-edit="ticket" data-id="'+tk.id+'">'
        +'<span class="thumb" style="background:linear-gradient(135deg,#a98fe6,#c9a8ef)">★</span>'
        +'<span><span class="ev-title">'+esc(tk.title)+'</span> '+st+'<br><span class="ev-sub">'+jDate(tk.date)+(tk.place?'　'+esc(tk.place):'')+'</span></span>'
        +'<span class="chev">›</span></div></div>';
    } else {
      tkHtml='<div class="card"><div class="empty">チケットはまだありません<br><span class="add-link" data-add="ticket">＋ チケットを追加</span></div></div>';
    }

    elHome.innerHTML =
      '<div class="card money-card"><span class="money-ic">💳</span>'

  function renderCalendar(){
    var y=cur.calY, m=cur.calM;
    var first=new Date(y,m,1).getDay();
    var days=new Date(y,m+1,0).getDate();
    var evByDay={}, tkByDay={};
    db.events.forEach(function(e){ if(inMonth(e.date,y,m)){ var d=parseYmd(e.date).getDate(); (evByDay[d]=evByDay[d]||[]).push(e); } });
    db.tickets.forEach(function(t){ if(inMonth(t.date,y,m)){ var d=parseYmd(t.date).getDate(); (tkByDay[d]=tkByDay[d]||[]).push(t); } });

    var cells="";
    for(var b=0;b<first;b++) cells+='<div class="d blank"><span class="num"></span></div>';
    var todayS=todayStr();
    for(var day=1;day<=days;day++){
      var ds=monthKey(y,m)+"-"+pad(day);
      var cls="d"; if(ds===todayS) cls+=" today"; if(ds===cur.selDay) cls+=" sel";
      var dots="";
      if(evByDay[day]) dots+='<i></i>';
      if(tkByDay[day]) dots+='<i class="p"></i>';
      cells+='<div class="'+cls+'" data-day="'+ds+'"><span class="num">'+day+'</span><span class="dots">'+dots+'</span></div>';
    }

    // list events + tickets of the month sorted by date
    var items=[];
    db.events.forEach(function(e){ if(inMonth(e.date,y,m)) items.push({t:"event",o:e}); });
    db.tickets.forEach(function(t){ if(inMonth(t.date,y,m)) items.push({t:"ticket",o:t}); });
    items.sort(function(a,b){ return a.o.date<b.o.date?-1:a.o.date>b.o.date?1:0; });

    var list="";
    if(items.length===0){
      list='<div class="card"><div class="empty">この月の予定はありません<br><span class="add-link" data-add="event">＋ 予定を追加</span></div></div>';
    } else {
      items.forEach(function(it){
        var o=it.o;
        if(it.t==="event"){
          list+='<div class="card cal-item" data-edit="event" data-id="'+o.id+'">'
            +'<span class="cal-ic" style="background:linear-gradient(135deg,'+oshiColor(o.oshiId)+',#c9a8ef)">'+oshiEmoji(o.oshiId)+'</span>'
            +'<span><span class="cal-date">'+jDate(o.date)+'</span><br><span class="cal-name">'+esc(o.title)+'</span>'
            +(o.place?'<br><span class="cal-place">'+esc(o.place)+'</span>':'')+'</span></div>';
        } else {
          var st = o.status==="won"?' 🎉当選':o.status==="lost"?' 落選':' 応募中';
          list+='<div class="card cal-item" data-edit="ticket" data-id="'+o.id+'">'
            +'<span class="cal-ic" style="background:linear-gradient(135deg,#a98fe6,#c9a8ef)">🎫</span>'
            +'<span><span class="cal-date">'+jDate(o.date)+'</span><br><span class="cal-name">'+esc(o.title)+esc(st)+'</span>'
            +(o.place?'<br><span class="cal-place">'+esc(o.place)+'</span>':'')+'</span></div>';
        }
      });
    }

    elCal.innerHTML =
      '<div class="cal-nav"><button id="calPrev">‹</button><span>'+y+'年'+(m+1)+'月</span><button id="calNext">›</button></div>'
      +'<div class="card"><div class="cal-grid">'
      +'<div class="wd sun">日</div><div class="wd">月</div><div class="wd">火</div><div class="wd">水</div><div class="wd">木</div><div class="wd">金</div><div class="wd sat">土</div>'
      +cells+'</div></div>'+list;
  }

  function renderRecord(){
    var y=cur.recY, m=cur.recM;
    var total=sumMonth(y,m);
    var pm=new Date(y,m-1,1); var prev=sumMonth(pm.getFullYear(), pm.getMonth());
    var diff=total-prev;
    var diffHtml = diff>0 ? '<span class="badge-up">+'+diff.toLocaleString("ja-JP")+' 円</span>'
                 : diff<0 ? '<span class="badge-down">'+diff.toLocaleString("ja-JP")+' 円</span>' : '';

    var days=new Date(y,m+1,0).getDate();
    var perDay=[]; var maxd=1;
    for(var d=1; d<=days; d++){ var k=monthKey(y,m)+"-"+pad(d); var s=0;
      db.expenses.forEach(function(e){ if(e.date===k) s+=(+e.amount||0); }); perDay.push(s); if(s>maxd)maxd=s; }
    var bars=""; perDay.forEach(function(s){ var h=s>0?Math.max(3,Math.round(s/maxd*100)):0; bars+='<i style="height:'+h+'%"></i>'; });

    var byCat={}; CATS.forEach(function(c){ byCat[c.id]=0; });
    db.expenses.forEach(function(e){ if(inMonth(e.date,y,m)){ byCat[e.category]=(byCat[e.category]||0)+(+e.amount||0); } });
    var catRows="";
    CATS.forEach(function(c){ if(byCat[c.id]>0){
      catRows+='<div class="rec-item"><span class="k"><span class="dot" style="background:'+c.color+'"></span>'+c.name+'</span><span class="v">'+yen(byCat[c.id])+'</span></div>';
    }});
    if(!catRows) catRows='<div class="empty">この月の記録はありません<br><span class="add-link" data-add="expense">＋ 支出を追加</span></div>';

    // individual expenses of the month (tap to edit)
    var exps=db.expenses.filter(function(e){ return inMonth(e.date,y,m); })
      .sort(function(a,b){ return a.date<b.date?1:-1; });
    var expRows="";
    exps.forEach(function(e){
      var c=catOf(e.category);
      expRows+='<div class="rec-item exp-item" data-edit="expense" data-id="'+e.id+'">'
        +'<span class="k"><span class="dot" style="background:'+c.color+'"></span>'+jDate(e.date)+' ・ '+c.name+(e.memo?' ・ '+esc(e.memo):'')+'</span>'
        +'<span class="v">'+yen(+e.amount)+'</span></div>';
    });

    elRec.innerHTML =
      '<div class="cal-nav"><button id="recPrev">‹</button><span>'+y+'年'+(m+1)+'月</span><button id="recNext">›</button></div>'
      +'<div class="card"><div class="lbl">今月の合計</div>'
      +'<div class="rec-total"><span class="n">'+yen(total)+'</span>'+diffHtml+'</div>'
      +'<div class="chart">'+(bars||'')+'</div>'
      +'<div class="chart-x"><span>1日</span><span>8日</span><span>15日</span><span>22日</span><span>'+days+'日</span></div></div>'
      +'<div class="card">'+catRows+'</div>'
      +(expRows?'<div class="sec-h"><span class="lbl">明細</span></div><div class="card">'+expRows+'</div>':'');
  }

  /* ---------- forms ---------- */
  var formState=null; // { type, id, temp:{} }

  function oshiOptions(sel){

  function buildForm(type, item){
    var b=document.getElementById("formBody");
    var t=item||{};
    formState={ type:type, id:t.id||null, temp:{} };
    document.getElementById("formErr").textContent="";
    var del=document.getElementById("formDelete");
    del.style.display = t.id ? "" : "none";

    if(type==="event"){
      document.getElementById("formTitle").textContent = t.id?"予定を編集":"ライブ・イベント予定";
      b.innerHTML =
        field("タイトル", '<input id="f_title" placeholder="○○ ARENA LIVE" value="'+esc(t.title||"")+'">', true)
        +field("推し", '<select id="f_oshi">'+oshiOptions(t.oshiId)+'</select>')
        +field("日付", '<input id="f_date" type="date" value="'+(t.date||todayStr())+'">', true)
        +field("会場", '<input id="f_place" placeholder="○○アリーナ" value="'+esc(t.place||"")+'">')
        +field("メモ", '<textarea id="f_memo" placeholder="開場時間・座席など">'+esc(t.memo||"")+'</textarea>');
    }
    else if(type==="ticket"){
      document.getElementById("formTitle").textContent = t.id?"チケットを編集":"チケット応募・当落";
      var stat=t.status||"applied";
      b.innerHTML =
        field("公演名", '<input id="f_title" placeholder="大阪公演" value="'+esc(t.title||"")+'">', true)
        +field("推し", '<select id="f_oshi">'+oshiOptions(t.oshiId)+'</select>')
        +field("日付", '<input id="f_date" type="date" value="'+(t.date||todayStr())+'">', true)
        +field("会場", '<input id="f_place" placeholder="大阪城ホール" value="'+esc(t.place||"")+'">')
        +field("状態", '<div class="seg" id="f_status">'
          +segBtn("applied","応募中",stat)+segBtn("won","当選",stat)+segBtn("lost","落選",stat)+'</div>');
    }
    else if(type==="expense"){
      document.getElementById("formTitle").textContent = t.id?"支出を編集":"推し活費の記録";
      var catOpts=""; CATS.forEach(function(c){ catOpts+='<option value="'+c.id+'"'+((t.category||"ticket")===c.id?" selected":"")+'>'+c.name+'</option>'; });
      b.innerHTML =
        field("金額", '<input id="f_amount" type="number" inputmode="numeric" placeholder="3000" value="'+(t.amount!=null?t.amount:"")+'">', true)
        +field("カテゴリ", '<select id="f_cat">'+catOpts+'</select>')
        +field("推し", '<select id="f_oshi">'+oshiOptions(t.oshiId)+'</select>')
        +field("日付", '<input id="f_date" type="date" value="'+(t.date||todayStr())+'">', true)
        +field("メモ", '<input id="f_memo" placeholder="グッズ名など" value="'+esc(t.memo||"")+'">');
    }
    else if(type==="oshi"){
      document.getElementById("formTitle").textContent = t.id?"推しを編集":"推しを登録";
      var em=t.emoji||OSHI_EMOJIS[0], col=t.color||OSHI_COLORS[0];
      formState.temp.emoji=em; formState.temp.color=col;
      var emojis=OSHI_EMOJIS.map(function(e){ return '<span class="emoji-pick'+(e===em?" on":"")+'" data-emoji="'+e+'">'+e+'</span>'; }).join("");
      var sw=OSHI_COLORS.map(function(c){ return '<span class="swatch'+(c===col?" on":"")+'" data-color="'+c+'" style="background:'+c+'"></span>'; }).join("");
      b.innerHTML =
        field("名前", '<input id="f_name" placeholder="推しの名前" value="'+esc(t.name||"")+'">', true)
        +field("アイコン", '<div class="emojis" id="f_emojis">'+emojis+'</div>')
        +field("カラー", '<div class="swatches" id="f_swatches">'+sw+'</div>');
    }

    // wire segmented / pickers
    b.querySelectorAll("#f_status .seg-b, #f_status button").forEach(function(){});
    var seg=b.querySelector("#f_status");
    if(seg){ seg.addEventListener("click", function(e){ var btn=e.target.closest("button"); if(!btn)return;
      seg.querySelectorAll("button").forEach(function(x){ x.classList.remove("on"); }); btn.classList.add("on"); formState.temp.status=btn.dataset.val; }); }
    var emj=b.querySelector("#f_emojis");
    if(emj){ emj.addEventListener("click", function(e){ var p=e.target.closest(".emoji-pick"); if(!p)return;
      emj.querySelectorAll(".emoji-pick").forEach(function(x){ x.classList.remove("on"); }); p.classList.add("on"); formState.temp.emoji=p.dataset.emoji; }); }
    var swc=b.querySelector("#f_swatches");
    if(swc){ swc.addEventListener("click", function(e){ var p=e.target.closest(".swatch"); if(!p)return;
      swc.querySelectorAll(".swatch").forEach(function(x){ x.classList.remove("on"); }); p.classList.add("on"); formState.temp.color=p.dataset.color; }); }

    formSheet.classList.add("show"); ovBg.classList.add("show"); formSheet.scrollTop=0;
  }
  function field(label, inner, req){ return '<div class="field"><label>'+label+(req?' <span class="req">*</span>':'')+'</label>'+inner+'</div>'; }
  function segBtn(val,label,cur){ return '<button type="button" data-val="'+val+'" class="'+(val===cur?"on":"")+'">'+label+'</button>'; }

  function openForm(type, id){
    closeAll();
    var item=null;
    if(id){ var arr=db[type==="event"?"events":type==="ticket"?"tickets":type==="expense"?"expenses":"oshi"];
      for(var i=0;i<arr.length;i++){ if(arr[i].id===id){ item=arr[i]; break; } } }

  function val(id){ var el=document.getElementById(id); return el?el.value.trim():""; }

  document.getElementById("formSave").addEventListener("click", function(){
    if(!formState) return;
    var errEl=document.getElementById("formErr"); errEl.textContent="";
    var type=formState.type, id=formState.id;
    if(type==="event"){
      var title=val("f_title"), date=val("f_date");
      if(!title){ errEl.textContent="タイトルを入力してください"; return; }
      if(!date){ errEl.textContent="日付を選んでください"; return; }
      var rec={ id:id||uid(), title:title, oshiId:val("f_oshi")||null, date:date, place:val("f_place"), memo:val("f_memo") };
      upsert("events", rec); showToast(id?"予定を更新しました":"予定を追加しました");
    }
    else if(type==="ticket"){
      var t2=val("f_title"), d2=val("f_date");
      if(!t2){ errEl.textContent="公演名を入力してください"; return; }
      var rec2={ id:id||uid(), title:t2, oshiId:val("f_oshi")||null, date:d2||todayStr(), place:val("f_place"), status:formState.temp.status||"applied" };
      upsert("tickets", rec2); showToast(id?"チケットを更新しました":"チケットを追加しました");
    }
    else if(type==="expense"){
      var amt=parseInt(val("f_amount"),10);
      if(!(amt>0)){ errEl.textContent="金額を正しく入力してください"; return; }
      var rec3={ id:id||uid(), amount:amt, category:val("f_cat")||"other", oshiId:val("f_oshi")||null, date:val("f_date")||todayStr(), memo:val("f_memo") };
      upsert("expenses", rec3); showToast(id?"支出を更新しました":"支出を記録しました");

    else if(type==="oshi"){
      var nm=val("f_name");
      if(!nm){ errEl.textContent="名前を入力してください"; return; }

      upsert("oshi", rec4); showToast(id?"推しを更新しました":"推しを登録しました");
    }
    save(); renderAll(); closeAll();
  });

  function upsert(coll, rec){
    var arr=db[coll]; var found=false;
    for(var i=0;i<arr.length;i++){ if(arr[i].id===rec.id){ arr[i]=rec; found=true; break; } }
    if(!found) arr.push(rec);
  }

  document.getElementById("formDelete").addEventListener("click", function(){
    if(!formState || !formState.id) return;
    if(!confirm("削除しますか？")) return;
    var coll=formState.type==="event"?"events":formState.type==="ticket"?"tickets":formState.type==="expense"?"expenses":"oshi";
    db[coll]=db[coll].filter(function(x){ return x.id!==formState.id; });
    save(); renderAll(); closeAll(); showToast("削除しました");
  });

      {id:uid(),title:"握手会イベント",oshiId:o2.id,date:dstr(Math.min(28,new Date(y,m+1,0).getDate())),place:"パシフィック大阪",memo:""}
    );
    db.tickets.push({id:uid(),title:"大阪公演",oshiId:o1.id,date:dstr(Math.min(24,new Date(y,m+1,0).getDate())),place:"大阪城ホール",status:"won"});
