<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>OshiLog</title>
<style>
  :root{
    --ink:#4a4458; --ink-soft:#7c7690; --ink-faint:#9a94ac;
    --purple:#9a80d8; --purple-deep:#7b62c6;
    --pink:#ff3d8b; --pink-deep:#f5227d;
    --accent:#ff3d8b; --accent-deep:#f5227d;
    --bg:#f6f0fb; --card:#ffffff; --line:#f0eaf8; --field:#f7f2fc;
    --nav-h:64px;
    --font:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,-apple-system,"Segoe UI",Meiryo,sans-serif;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; overflow:hidden; overscroll-behavior:none; }
  body{
    font-family:var(--font); color:var(--ink); line-height:1.6;
    background:linear-gradient(180deg,#f7f1fc 0%,#f1e9f9 100%);
    -webkit-font-smoothing:antialiased;
    -webkit-user-select:none; user-select:none; position:fixed; inset:0;
  }
  .app{ height:100%; display:flex; flex-direction:column; max-width:520px; margin:0 auto; position:relative; overflow:hidden; }

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:calc(env(safe-area-inset-top) + 12px) 18px 12px;
    font-size:18px; font-weight:800; color:#3f3a4a; flex:0 0 auto;
    background:rgba(247,241,252,.9); backdrop-filter:blur(8px); z-index:5;
  }
  .topbar .ic{ font-size:20px; color:#8a83a0; width:26px; text-align:center; cursor:pointer; }
  .topbar .title{ flex:1; text-align:center; }

  .scroll{ flex:1; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; padding:6px 16px calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px); }
  .screen{ display:none; }
  .screen.active{ display:block; animation:fade .22s ease; }
  @keyframes fade{ from{ opacity:0; transform:translateY(6px) } to{ opacity:1; transform:none } }

  .card{ background:var(--card); border-radius:18px; padding:14px 15px; box-shadow:0 6px 20px rgba(120,90,180,.08); margin-bottom:12px; }
  .row{ display:flex; align-items:center; }
  .between{ justify-content:space-between; }
  .lbl{ font-size:12px; color:var(--ink-faint); font-weight:700; }
  .hint{ font-size:11.5px; color:var(--ink-faint); margin:2px 2px 10px; line-height:1.5; }
  .seeall{ font-size:11px; color:var(--purple-deep); font-weight:700; cursor:pointer; }
  .sec-h{ display:flex; justify-content:space-between; align-items:center; margin:14px 2px 8px; }
  .sec-h .lbl{ font-size:13px; }
  .empty{ color:var(--ink-faint); font-size:13px; text-align:center; padding:16px 8px; line-height:1.7; }
  .empty .add-link{ color:var(--purple-deep); font-weight:800; cursor:pointer; }

  /* countdown hero */
  .cd-hero{ background:linear-gradient(135deg,var(--accent),#b98fe0); color:#fff; border-radius:20px; padding:16px 18px; margin-bottom:12px; box-shadow:0 10px 24px rgba(255,61,139,.22); }
  .cd-hero .cd-lbl{ font-size:12px; opacity:.92; font-weight:700; }
  .cd-hero .cd-main{ display:flex; align-items:baseline; gap:8px; margin-top:2px; }
  .cd-hero .cd-name{ font-size:16px; font-weight:800; }
  .cd-hero .cd-num{ margin-left:auto; font-size:34px; font-weight:800; line-height:1; }
  .cd-hero .cd-num small{ font-size:15px; font-weight:700; }
  .cd-hero .cd-date{ font-size:11.5px; opacity:.9; margin-top:4px; }

  .money-card{ background:linear-gradient(120deg,#efe8fb,#e9e0f8); display:flex; align-items:center; gap:12px; }
  .money-ic{ width:40px;height:40px;border-radius:12px;background:#fff;display:grid;place-items:center;font-size:20px;box-shadow:0 3px 8px rgba(120,90,180,.16);flex:0 0 auto; }
  .money-card .val{ font-size:25px; font-weight:800; line-height:1.15; white-space:nowrap; }
  .money-card .sub-y{ font-size:11px; color:var(--ink-faint); font-weight:700; }
  .spark{ margin-left:auto; display:flex; gap:3px; align-items:flex-end; height:34px; }
  .spark i{ width:6px; background:#b9a6ec; border-radius:3px; display:block; min-height:3px; }
  .duo{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px; }
  .duo .card{ margin:0; }
  .duo .ic{ font-size:20px; }
  .duo .big{ font-size:26px; font-weight:800; }
  .duo .big small{ font-size:14px; }
  .pinkbg{ background:#fdeef4; } .lavbg{ background:#f1ecfb; }
  .thumb{ width:52px;height:52px;border-radius:12px;flex:0 0 auto;display:grid;place-items:center;color:#fff;font-size:24px; }
  .ev-row{ display:flex; align-items:center; gap:12px; cursor:pointer; }
  .ev-title{ font-size:15px; font-weight:800; }
  .ev-sub{ font-size:12px; color:var(--ink-faint); }
  .chev{ margin-left:auto; color:#c8c1da; font-size:20px; }
  .badge-st{ font-weight:800; font-size:13px; }
  .st-won{ color:var(--accent); } .st-lost{ color:var(--ink-faint); } .st-applied{ color:var(--purple-deep); } .st-paid{ color:#3aa981; }

  /* calendar */
  .cal-nav{ display:flex; align-items:center; justify-content:center; gap:20px; font-size:16px; font-weight:800; padding:6px 0 12px; }
  .cal-nav button{ border:0; background:none; font-size:20px; color:#b7aecd; cursor:pointer; padding:4px 10px; }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px 0; text-align:center; }
  .cal-grid .wd{ font-size:12px; font-weight:700; color:var(--ink-faint); padding-bottom:5px; }
  .cal-grid .wd.sun{ color:#e690b3; } .cal-grid .wd.sat{ color:#8fa8e0; }
  .cal-grid .d{ font-size:14px; color:#5c5670; padding:5px 0; cursor:pointer; }
  .cal-grid .d.blank{ cursor:default; }
  .cal-grid .d .num{ display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%; margin:0 auto; }
  .cal-grid .d.today .num{ box-shadow:inset 0 0 0 2px var(--purple); }
  .cal-grid .d.sel .num{ background:#8a6fd6; color:#fff; font-weight:700; }
  .cal-grid .d .dots{ display:flex;gap:3px;justify-content:center;margin-top:2px;height:5px; }
  .cal-grid .d .dots i{ width:5px;height:5px;border-radius:50%;background:#c9a8ef; } .cal-grid .d .dots i.p{ background:var(--accent); } .cal-grid .d .dots i.b{ background:#f6b83a; }
  .cal-item{ display:flex; align-items:center; gap:12px; cursor:pointer; }
  .cal-ic{ width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:0 0 auto;color:#fff; }
  .cal-date{ font-size:12px;color:var(--ink-faint);font-weight:700; }
  .cal-name{ font-size:15px;font-weight:800; } .cal-place{ font-size:12px;color:#b3aac6; }

  /* record */
  .rec-total{ display:flex; align-items:baseline; gap:10px; margin:4px 0 8px; flex-wrap:wrap; }
  .rec-total .n{ font-size:30px; font-weight:800; white-space:nowrap; }
  .badge-up{ background:#fde6ef; color:var(--accent-deep); font-size:12px; font-weight:800; padding:3px 10px; border-radius:20px; white-space:nowrap; }
  .badge-down{ background:#e8f0ff; color:#5f7fd0; font-size:12px; font-weight:800; padding:3px 10px; border-radius:20px; white-space:nowrap; }
  .chart{ display:flex; align-items:flex-end; gap:3px; height:120px; padding:8px 0 6px; border-bottom:1px solid var(--line); }
  .chart i{ flex:1; border-radius:4px 4px 0 0; background:linear-gradient(180deg,#c9a8ef,#a98fe6); min-height:2px; }
  .chart-x{ display:flex; justify-content:space-between; font-size:11px; color:#b3aac6; padding-top:6px; }
  .rec-item{ display:flex; justify-content:space-between; align-items:center; padding:12px 2px; border-bottom:1px solid var(--line); font-size:14.5px; gap:10px; }
  .rec-item:last-child{ border-bottom:0; }
  .rec-item .k{ color:#5c5670; font-weight:700; display:flex; align-items:center; gap:10px; min-width:0; }
  .rec-item .k .t{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rec-item .dot{ width:10px;height:10px;border-radius:50%;flex:0 0 auto; }
  .rec-item .v{ font-weight:800; white-space:nowrap; }
  .exp-item{ cursor:pointer; }
  .peryear{ display:flex; justify-content:space-between; padding:10px 2px; border-bottom:1px solid var(--line); font-size:14px; }
  .peryear:last-child{ border-bottom:0; }

  /* mypage */
  .prof{ display:flex; align-items:center; gap:14px; }
  .avatar{ width:60px;height:60px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#fff,#f3e3f2);display:grid;place-items:center;font-size:30px;box-shadow:inset 0 0 0 3px rgba(255,255,255,.6);flex:0 0 auto; }
  .prof .name{ font-size:18px; font-weight:800; }
  .prof .sub{ font-size:12px; color:var(--ink-faint); }
  .oshi-chip{ display:flex; align-items:center; gap:10px; padding:11px 4px; border-bottom:1px solid var(--line); cursor:pointer; }
  .oshi-chip:last-child{ border-bottom:0; }
  .oshi-badge{ width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:19px;color:#fff;flex:0 0 auto; }
  .oshi-chip .nm{ font-weight:700; font-size:15px; }
  .oshi-chip .meta{ font-size:11px; color:var(--ink-faint); }
  .menu-item{ display:flex; align-items:center; gap:14px; padding:15px 4px; border-bottom:1px solid var(--line); font-size:15px; font-weight:600; cursor:pointer; }
  .menu-item:last-child{ border-bottom:0; }
  .menu-item .mi{ font-size:20px; width:26px; text-align:center; }
  .menu-item .chev{ margin-left:auto; font-size:18px; color:#c8c1da; }
  .btn-add-inline{ display:inline-flex; align-items:center; gap:6px; color:var(--purple-deep); font-weight:800; font-size:13px; cursor:pointer; }
  .theme-row{ display:flex; gap:10px; flex-wrap:wrap; padding:4px 2px; }

  /* bottom nav */
  .nav{
    position:absolute; left:0; right:0; bottom:0; height:calc(var(--nav-h) + env(safe-area-inset-bottom));
    padding-bottom:env(safe-area-inset-bottom);
    display:flex; align-items:center; justify-content:space-around;
    background:#fff; border-top:1px solid var(--line);
    box-shadow:0 -4px 20px rgba(120,90,180,.08); z-index:6;
  }
  .nav .tab{ display:flex; flex-direction:column; align-items:center; gap:3px; font-size:11px; color:#b3aac6; font-weight:700; border:0; background:none; cursor:pointer; flex:1; padding:8px 0; }
  .nav .tab .ni{ font-size:22px; line-height:1; }
  .nav .tab.active{ color:var(--purple-deep); }
  .nav .fab{ width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:30px;line-height:1;margin-top:-22px;box-shadow:0 8px 18px rgba(255,61,139,.4);border:0;cursor:pointer;flex:0 0 auto; }
  .nav .fab:active{ transform:scale(.94); }

  /* sheets + dialog */
  .ov-bg{ position:absolute; inset:0; background:rgba(60,45,90,.42); opacity:0; pointer-events:none; transition:opacity .2s; z-index:20; }
  .ov-bg.show{ opacity:1; pointer-events:auto; }
  .sheet{ position:absolute; left:0; right:0; bottom:0; background:#fff; border-radius:24px 24px 0 0; padding:8px 20px calc(env(safe-area-inset-bottom) + 24px); transform:translateY(110%); transition:transform .26s cubic-bezier(.2,.8,.2,1); z-index:21; max-height:90%; overflow-y:auto; }
  .sheet.show{ transform:none; }
  .grab{ width:40px;height:4px;border-radius:2px;background:#e2dbef;margin:8px auto 14px; }
  .sheet h3{ margin:0 0 4px; font-size:16px; text-align:center; }
  .sheet .sub-h{ font-size:12px; color:var(--ink-faint); text-align:center; margin:0 0 14px; }
  .add-opt{ display:flex; align-items:center; gap:14px; width:100%; padding:15px 12px; border:0; background:var(--field); border-radius:14px; margin-bottom:10px; font-size:15px; font-weight:700; color:var(--ink); cursor:pointer; text-align:left; }
  .add-opt .ai{ width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:#efe6fb;flex:0 0 auto; }
  .add-opt .ad{ display:block; font-size:11px; color:var(--ink-faint); font-weight:600; margin-top:2px; }

  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12px; font-weight:700; color:var(--ink-soft); margin-bottom:6px; }
  .field input, .field select, .field textarea{
    width:100%; border:1px solid var(--line); background:var(--field); border-radius:12px;
    padding:12px 13px; font-size:15px; font-family:inherit; color:var(--ink); -webkit-user-select:text; user-select:text;
  }
  .field input:focus, .field select:focus, .field textarea:focus{ outline:none; border-color:var(--purple); background:#fff; }
  .field textarea{ resize:none; min-height:60px; }
  .field .fh{ font-size:11px; color:var(--ink-faint); margin-top:5px; }
  .two{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .req{ color:var(--accent); }
  .seg{ display:flex; gap:8px; flex-wrap:wrap; }
  .seg button{ flex:1; min-width:70px; border:1px solid var(--line); background:var(--field); border-radius:12px; padding:11px 0; font-size:14px; font-weight:700; color:var(--ink-soft); cursor:pointer; }
  .seg button.on{ background:var(--purple); color:#fff; border-color:var(--purple); }
  .swatches, .emojis{ display:flex; flex-wrap:wrap; gap:8px; }
  .swatch{ width:34px;height:34px;border-radius:50%;cursor:pointer;border:3px solid #fff;box-shadow:0 0 0 1px var(--line); }
  .swatch.on{ box-shadow:0 0 0 2px var(--purple); }
  .emoji-pick{ width:38px;height:38px;border-radius:11px;background:var(--field);display:grid;place-items:center;font-size:20px;cursor:pointer;border:2px solid transparent; }
  .emoji-pick.on{ border-color:var(--purple); background:#fff; }
  .form-actions{ display:flex; gap:10px; margin-top:6px; }
  .btn{ flex:1; border:0; border-radius:14px; padding:14px 0; font-size:15px; font-weight:800; cursor:pointer; }
  .btn-primary{ background:var(--accent); color:#fff; box-shadow:0 6px 14px rgba(255,61,139,.32); }
  .btn-ghost{ background:var(--field); color:var(--ink-soft); }
  .btn-danger{ background:#fdeaf0; color:var(--accent-deep); flex:0 0 auto; padding:14px 18px; }
  .err{ color:var(--accent-deep); font-size:12px; font-weight:700; text-align:center; margin:0 0 8px; min-height:16px; }

  .dialog{ position:absolute; left:50%; top:50%; transform:translate(-50%,-46%) scale(.96); opacity:0; pointer-events:none; transition:.2s; width:min(360px,88%); max-height:82%; overflow-y:auto; background:#fff; border-radius:22px; padding:22px 20px; z-index:25; box-shadow:0 22px 54px rgba(60,40,100,.32); }
  .dialog.show{ opacity:1; transform:translate(-50%,-50%) scale(1); pointer-events:auto; }
  .dialog h4{ margin:0 0 10px; font-size:17px; text-align:center; }
  .dialog .dtext{ margin:0 0 18px; font-size:14px; color:var(--ink-soft); text-align:center; white-space:pre-line; line-height:1.7; }
  .dialog .dbody{ font-size:13.5px; color:var(--ink-soft); line-height:1.8; }
  .dialog .dbody h5{ margin:14px 0 4px; font-size:14px; color:var(--ink); }
  .dialog .dbody p{ margin:0 0 8px; }
  .drow{ display:flex; gap:10px; margin-top:16px; }

  .toast{ position:absolute; left:50%; bottom:calc(var(--nav-h) + 30px); transform:translateX(-50%) translateY(20px); background:#4a4458; color:#fff; padding:10px 18px; border-radius:20px; font-size:13px; font-weight:700; opacity:0; pointer-events:none; transition:all .25s; z-index:40; white-space:nowrap; }
  .toast.show{ opacity:1; transform:translateX(-50%); }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <span class="ic" id="btnMenu">☰</span>
    <span class="title" id="topTitle">ホーム</span>
    <span class="ic" id="btnHelp">？</span>
  </div>

  <div class="scroll" id="scroll">
    <section class="screen active" id="s-home"></section>
    <section class="screen" id="s-cal"></section>
    <section class="screen" id="s-rec"></section>
    <section class="screen" id="s-my"></section>
  </div>

  <nav class="nav">
    <button class="tab active" data-tab="home"><span class="ni">🏠</span>ホーム</button>
    <button class="tab" data-tab="cal"><span class="ni">📅</span>カレンダー</button>
    <button class="fab" id="fab" aria-label="追加">＋</button>
    <button class="tab" data-tab="rec"><span class="ni">📝</span>記録</button>
    <button class="tab" data-tab="my"><span class="ni">👤</span>マイページ</button>
  </nav>

  <div class="ov-bg" id="ovBg"></div>

  <div class="sheet" id="addSheet">
    <div class="grab"></div>
    <h3>＋ 追加する</h3>
    <p class="sub-h">記録したいものを選んでください</p>
    <button class="add-opt" data-add="event"><span class="ai">📅</span><span>ライブ・イベント予定<span class="ad">ライブ / 握手会 / 発売日 / 締切など</span></span></button>
    <button class="add-opt" data-add="ticket"><span class="ai">🎫</span><span>チケット応募・当落<span class="ad">応募 → 当落 → 入金まで管理</span></span></button>
    <button class="add-opt" data-add="expense"><span class="ai">💰</span><span>推し活費の記録<span class="ad">チケット / グッズ / 遠征など</span></span></button>
    <button class="add-opt" data-add="oshi"><span class="ai">💜</span><span>推しを登録<span class="ad">名前 / 誕生日 / 推しカラー</span></span></button>
  </div>

  <div class="sheet" id="formSheet">
    <div class="grab"></div>
    <h3 id="formTitle">追加</h3>
    <p class="err" id="formErr"></p>
    <div id="formBody"></div>
    <div class="form-actions">
      <button class="btn btn-danger" id="formDelete" style="display:none">削除</button>
      <button class="btn btn-ghost" id="formCancel">キャンセル</button>
      <button class="btn btn-primary" id="formSave">保存</button>
    </div>
  </div>

  <div class="dialog" id="dialog"></div>
  <div class="toast" id="toast"></div>
</div>

<script>
(function(){
  "use strict";

  /* ---------- storage ---------- */
  var KEY="oshilog:v2";
  function blank(){ return { profile:{ name:"推し活ユーザー", emoji:"🙆‍♀️", themeColor:"#ff3d8b", welcomed:false }, oshi:[], events:[], tickets:[], expenses:[] }; }
  var db;
  try{ db=JSON.parse(localStorage.getItem(KEY))||null; }catch(e){ db=null; }
  if(!db) db=blank();
  ["oshi","events","tickets","expenses"].forEach(function(k){ if(!Array.isArray(db[k])) db[k]=[]; });
  if(!db.profile) db.profile=blank().profile;
  if(!db.profile.themeColor) db.profile.themeColor="#ff3d8b";
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(db)); return true; }catch(e){ return false; } }
  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

  /* ---------- constants ---------- */
  var CATS=[
    { id:"ticket", name:"チケット",   color:"#a98fe6" },
    { id:"goods",  name:"グッズ",     color:"#c9a8ef" },
    { id:"cd",     name:"CD・DVD",    color:"#b0a0ea" },
    { id:"travel", name:"遠征交通費", color:"#e0a8d8" },
    { id:"hotel",  name:"ホテル",     color:"#efb0d0" },
    { id:"food",   name:"飲食",       color:"#f2a6c4" },
    { id:"beauty", name:"美容",       color:"#f6b6ac" },
    { id:"other",  name:"その他",     color:"#d7c6f0" }
  ];
  function catOf(id){ for(var i=0;i<CATS.length;i++) if(CATS[i].id===id) return CATS[i]; return CATS[CATS.length-1]; }
  var OSHI_COLORS=["#9a80d8","#ff3d8b","#4f9df0","#2fb98a","#f2913a","#e0554f","#7ec8f0","#b98fe0"];
  var OSHI_EMOJIS=["💜","💙","💚","💛","🧡","❤️","🩷","⭐","🌟","🎤","🎸","👑"];
  var TSTAT=[ {id:"applied",label:"応募済み"}, {id:"won",label:"当選"}, {id:"lost",label:"落選"}, {id:"paid",label:"入金済み"} ];
  function statLabel(s){ for(var i=0;i<TSTAT.length;i++) if(TSTAT[i].id===s) return TSTAT[i].label; return "応募済み"; }

  /* ---------- date utils ---------- */
  function pad(n){ return (n<10?"0":"")+n; }
  function ymd(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
  function todayStr(){ return ymd(new Date()); }
  function parseYmd(s){ var p=(s||"").split("-"); return new Date(+p[0],(+p[1]||1)-1,+p[2]||1); }
  function daysUntil(s){ var t=new Date(); t.setHours(0,0,0,0); var d=parseYmd(s); d.setHours(0,0,0,0); return Math.round((d-t)/86400000); }
  var WD=["日","月","火","水","木","金","土"];
  function jDate(s){ var d=parseYmd(s); return (d.getMonth()+1)+"/"+d.getDate()+"（"+WD[d.getDay()]+"）"; }
  function yen(n){ return (n||0).toLocaleString("ja-JP")+" 円"; }
  function monthKey(y,m){ return y+"-"+pad(m+1); }
  function inMonth(s,y,m){ var d=parseYmd(s); return d.getFullYear()===y && d.getMonth()===m; }
  function inYear(s,y){ return parseYmd(s).getFullYear()===y; }
  // days until next occurrence of a MM-DD birthday
  function daysToBirthday(mmdd){
    if(!mmdd) return null; var p=mmdd.split("-"); if(p.length<2) return null;
    var mo=+p[0]-1, da=+p[1]; var t=new Date(); t.setHours(0,0,0,0);
    var y=t.getFullYear(); var next=new Date(y,mo,da); next.setHours(0,0,0,0);
    if(next<t) next=new Date(y+1,mo,da);
    return Math.round((next-t)/86400000);
  }

  function oshiById(id){ for(var i=0;i<db.oshi.length;i++) if(db.oshi[i].id===id) return db.oshi[i]; return null; }
  function oshiColor(id){ var o=oshiById(id); return o?o.color:"#b19be0"; }
  function oshiEmoji(id){ var o=oshiById(id); return o?o.emoji:"🎤"; }
  function oshiName(id){ var o=oshiById(id); return o?o.name:""; }

  /* ---------- theme ---------- */
  function applyTheme(){
    var c=db.profile.themeColor||"#ff3d8b";
    document.documentElement.style.setProperty("--accent", c);
    document.documentElement.style.setProperty("--accent-deep", c);
  }

  /* ---------- state ---------- */
  var now0=new Date();
  var cur={ tab:"home", calY:now0.getFullYear(), calM:now0.getMonth(), recY:now0.getFullYear(), recM:now0.getMonth(), selDay:todayStr() };

  var elHome=document.getElementById("s-home"), elCal=document.getElementById("s-cal"),
      elRec=document.getElementById("s-rec"), elMy=document.getElementById("s-my");

  function esc(s){ return (s==null?"":String(s)).replace(/[&<>"]/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }
  function upcomingEvents(){ return db.events.slice().filter(function(e){ return daysUntil(e.date)>=0; }).sort(function(a,b){ return a.date<b.date?-1:1; }); }
  function sumMonth(y,m){ var s=0; db.expenses.forEach(function(e){ if(inMonth(e.date,y,m)) s+=(+e.amount||0); }); return s; }
  function sumYear(y){ var s=0; db.expenses.forEach(function(e){ if(inYear(e.date,y)) s+=(+e.amount||0); }); return s; }

  /* ---------- HOME ---------- */
  function renderHome(){
    var now=new Date(), y=now.getFullYear(), m=now.getMonth();
    var monthSpend=sumMonth(y,m), yearSpend=sumYear(y);
    var up=upcomingEvents(), next=up[0];
    var evCount=db.events.filter(function(e){ return inMonth(e.date,y,m); }).length;

    // nearest birthday among oshi
    var bday=null;
    db.oshi.forEach(function(o){ var d=daysToBirthday(o.birthday); if(d!=null && (bday==null || d<bday.d)) bday={ d:d, o:o }; });

    // countdown hero: nearest of (next event) vs nothing
    var hero="";
    if(next){
      var dn=daysUntil(next.date);
      hero='<div class="cd-hero" data-edit="event" data-id="'+next.id+'">'
        +'<div class="cd-lbl">次の予定まで</div>'
        +'<div class="cd-main"><span class="cd-name">'+(oshiName(next.oshiId)?esc(oshiName(next.oshiId))+' / ':'')+esc(next.title)+'</span>'
        +'<span class="cd-num">'+(dn===0?'当日':'あと'+dn)+(dn>0?'<small>日</small>':'')+'</span></div>'
        +'<div class="cd-date">'+jDate(next.date)+(next.place?' ・ '+esc(next.place):'')+'</div></div>';
    }

    // spark last 7 days
    var arr=[],maxd=1;
    for(var i=6;i>=0;i--){ var d=new Date(); d.setDate(d.getDate()-i); var k=ymd(d),s=0; db.expenses.forEach(function(e){ if(e.date===k) s+=(+e.amount||0); }); arr.push(s); if(s>maxd)maxd=s; }
    var spark=arr.map(function(s){ return '<i style="height:'+Math.max(4,Math.round(s/maxd*30))+'px"></i>'; }).join("");

    var nextHtml = next
      ? '<div class="card"><div class="ev-row" data-edit="event" data-id="'+next.id+'">'
        +'<span class="thumb" style="background:linear-gradient(135deg,'+oshiColor(next.oshiId)+',#c9a8ef)">'+oshiEmoji(next.oshiId)+'</span>'
        +'<span><span class="ev-title">'+jDate(next.date)+'</span><br><span class="ev-title">'+esc(next.title)+'</span>'
        +(next.place?'<br><span class="ev-sub">会場：'+esc(next.place)+'</span>':'')+'</span><span class="chev">›</span></div></div>'
      : '<div class="card"><div class="empty">予定はまだありません<br><span class="add-link" data-add="event">＋ 予定を追加する</span></div></div>';

    var tk=db.tickets.slice().sort(function(a,b){ return a.date<b.date?1:-1; })[0];
    var tkHtml;
    if(tk){
      var cls={applied:"st-applied",won:"st-won",lost:"st-lost",paid:"st-paid"}[tk.status]||"st-applied";
      var emo=tk.status==="won"?"🎉":tk.status==="paid"?"✅":"";
      tkHtml='<div class="card"><div class="ev-row" data-edit="ticket" data-id="'+tk.id+'">'
        +'<span class="thumb" style="background:linear-gradient(135deg,#a98fe6,#c9a8ef)">🎫</span>'
        +'<span><span class="ev-title">'+esc(tk.title)+'</span> <span class="badge-st '+cls+'">'+statLabel(tk.status)+emo+'</span>'
        +'<br><span class="ev-sub">'+jDate(tk.date)+(tk.place?'　'+esc(tk.place):'')+'</span></span><span class="chev">›</span></div></div>';
    } else {
      tkHtml='<div class="card"><div class="empty">チケットはまだありません<br><span class="add-link" data-add="ticket">＋ チケットを追加する</span></div></div>';
    }

    var bdayHtml="";
    if(bday){
      bdayHtml='<div class="card" data-edit="oshi" data-id="'+bday.o.id+'" style="cursor:pointer"><div class="row" style="gap:12px">'
        +'<span class="thumb" style="width:44px;height:44px;font-size:20px;background:'+bday.o.color+'">🎂</span>'
        +'<span><span class="lbl">推しの誕生日まで</span><br><span class="ev-title">'+esc(bday.o.name)+' の誕生日</span></span>'
        +'<span style="margin-left:auto;font-weight:800;font-size:20px;color:'+bday.o.color+'">'+(bday.d===0?'今日🎉':'あと'+bday.d+'日')+'</span></div></div>';
    }

    var firstRunTip = (db.oshi.length===0 && db.events.length===0 && db.tickets.length===0 && db.expenses.length===0)
      ? '<div class="card" style="background:linear-gradient(120deg,#fdeef4,#f1ecfb)"><div class="empty" style="color:var(--ink-soft)">👋 ようこそ！まずは下の <b style="color:var(--accent)">＋</b> から推しや予定を追加してみましょう。<br><span class="add-link" id="tipSample">✨ サンプルで試してみる</span></div></div>'
      : '';

    elHome.innerHTML =
      firstRunTip + hero
      +'<div class="card money-card"><span class="money-ic">💳</span>'
      +'<span><span class="lbl">今月の推し活費</span><br><span class="val">'+yen(monthSpend)+'</span><br><span class="sub-y">今年の合計 '+yen(yearSpend)+'</span></span>'
      +'<span class="spark">'+spark+'</span></div>'
      +'<div class="duo">'
      +'<div class="card pinkbg"><span class="ic">📅</span><br><span class="lbl">次のライブまで</span><br><span class="big">'+(next?daysUntil(next.date):"—")+(next?'<small>日</small>':'')+'</span></div>'
      +'<div class="card lavbg"><span class="ic">⭐</span><br><span class="lbl">今月のイベント</span><br><span class="big">'+evCount+'<small>件</small></span></div></div>'
      +(bdayHtml?('<div class="sec-h"><span class="lbl">誕生日カウントダウン</span></div>'+bdayHtml):'')
      +'<div class="sec-h"><span class="lbl">次の予定</span><span class="seeall" data-go="cal">カレンダー ›</span></div>'+nextHtml
      +'<div class="sec-h"><span class="lbl">チケット状況</span></div>'+tkHtml;
  }

  /* ---------- CALENDAR ---------- */
  function renderCalendar(){
    var y=cur.calY, m=cur.calM;
    var first=new Date(y,m,1).getDay(), days=new Date(y,m+1,0).getDate();
    var evByDay={}, tkByDay={}, bdByDay={};
    db.events.forEach(function(e){ if(inMonth(e.date,y,m)){ var d=parseYmd(e.date).getDate(); (evByDay[d]=evByDay[d]||[]).push(e); } });
    db.tickets.forEach(function(t){ if(inMonth(t.date,y,m)){ var d=parseYmd(t.date).getDate(); (tkByDay[d]=tkByDay[d]||[]).push(t); } });
    db.oshi.forEach(function(o){ if(o.birthday){ var p=o.birthday.split("-"); if((+p[0]-1)===m){ bdByDay[+p[1]]=true; } } });

    var cells="";
    for(var b=0;b<first;b++) cells+='<div class="d blank"><span class="num"></span></div>';
    var todayS=todayStr();
    for(var day=1;day<=days;day++){
      var ds=monthKey(y,m)+"-"+pad(day), cls="d";
      if(ds===todayS) cls+=" today"; if(ds===cur.selDay) cls+=" sel";
      var dots=""; if(evByDay[day]) dots+='<i></i>'; if(tkByDay[day]) dots+='<i class="p"></i>'; if(bdByDay[day]) dots+='<i class="b"></i>';
      cells+='<div class="'+cls+'" data-day="'+ds+'"><span class="num">'+day+'</span><span class="dots">'+dots+'</span></div>';
    }

    var items=[];
    db.events.forEach(function(e){ if(inMonth(e.date,y,m)) items.push({t:"event",o:e}); });
    db.tickets.forEach(function(t){ if(inMonth(t.date,y,m)) items.push({t:"ticket",o:t}); });
    items.sort(function(a,b){ return a.o.date<b.o.date?-1:1; });

    var list;
    if(!items.length){
      list='<div class="card"><div class="empty">この月の予定はありません<br><span class="add-link" data-add="event">＋ 予定を追加する</span></div></div>';
    } else {
      list=items.map(function(it){ var o=it.o;
        if(it.t==="event"){
          return '<div class="card cal-item" data-edit="event" data-id="'+o.id+'">'
            +'<span class="cal-ic" style="background:linear-gradient(135deg,'+oshiColor(o.oshiId)+',#c9a8ef)">'+oshiEmoji(o.oshiId)+'</span>'
            +'<span><span class="cal-date">'+jDate(o.date)+'</span><br><span class="cal-name">'+esc(o.title)+'</span>'
            +(o.place?'<br><span class="cal-place">'+esc(o.place)+'</span>':'')+'</span></div>';
        }
        return '<div class="card cal-item" data-edit="ticket" data-id="'+o.id+'">'
          +'<span class="cal-ic" style="background:linear-gradient(135deg,#a98fe6,#c9a8ef)">🎫</span>'
          +'<span><span class="cal-date">'+jDate(o.date)+'</span><br><span class="cal-name">'+esc(o.title)+' ・ '+statLabel(o.status)+'</span>'
          +(o.place?'<br><span class="cal-place">'+esc(o.place)+'</span>':'')+'</span></div>';
      }).join("");
    }

    elCal.innerHTML =
      '<div class="cal-nav"><button id="calPrev">‹</button><span>'+y+'年'+(m+1)+'月</span><button id="calNext">›</button></div>'
      +'<div class="card"><div class="cal-grid">'
      +'<div class="wd sun">日</div><div class="wd">月</div><div class="wd">火</div><div class="wd">水</div><div class="wd">木</div><div class="wd">金</div><div class="wd sat">土</div>'
      +cells+'</div></div>'
      +'<p class="hint">🟣 予定　🔴 チケット　🟡 推しの誕生日</p>'+list;
  }

  /* ---------- RECORD ---------- */
  function renderRecord(){
    var y=cur.recY, m=cur.recM;
    var total=sumMonth(y,m);
    var pm=new Date(y,m-1,1), prev=sumMonth(pm.getFullYear(),pm.getMonth()), diff=total-prev;
    var diffHtml = diff>0?'<span class="badge-up">前月比 +'+diff.toLocaleString("ja-JP")+'</span>':diff<0?'<span class="badge-down">前月比 '+diff.toLocaleString("ja-JP")+'</span>':'';

    var days=new Date(y,m+1,0).getDate(), perDay=[], maxd=1;
    for(var d=1;d<=days;d++){ var k=monthKey(y,m)+"-"+pad(d),s=0; db.expenses.forEach(function(e){ if(e.date===k) s+=(+e.amount||0); }); perDay.push(s); if(s>maxd)maxd=s; }
    var bars=perDay.map(function(s){ return '<i style="height:'+(s>0?Math.max(3,Math.round(s/maxd*100)):0)+'%"></i>'; }).join("");

    var byCat={}; CATS.forEach(function(c){ byCat[c.id]=0; });
    db.expenses.forEach(function(e){ if(inMonth(e.date,y,m)) byCat[e.category]=(byCat[e.category]||0)+(+e.amount||0); });
    var catRows=CATS.filter(function(c){ return byCat[c.id]>0; }).map(function(c){
      return '<div class="rec-item"><span class="k"><span class="dot" style="background:'+c.color+'"></span>'+c.name+'</span><span class="v">'+yen(byCat[c.id])+'</span></div>'; }).join("");
    if(!catRows) catRows='<div class="empty">この月の記録はありません<br><span class="add-link" data-add="expense">＋ 支出を追加する</span></div>';

    // per-oshi this year
    var yearTotal=sumYear(y), byOshi={};
    db.expenses.forEach(function(e){ if(inYear(e.date,y)){ var k=e.oshiId||"_"; byOshi[k]=(byOshi[k]||0)+(+e.amount||0); } });
    var oshiRows="";
    Object.keys(byOshi).sort(function(a,b){ return byOshi[b]-byOshi[a]; }).forEach(function(k){
      var nm=k==="_"?"推し未設定":(oshiEmoji(k)+" "+oshiName(k)); oshiRows+='<div class="peryear"><span>'+esc(nm)+'</span><span style="font-weight:800">'+yen(byOshi[k])+'</span></div>';
    });

    var exps=db.expenses.filter(function(e){ return inMonth(e.date,y,m); }).sort(function(a,b){ return a.date<b.date?1:-1; });
    var expRows=exps.map(function(e){ var c=catOf(e.category);
      return '<div class="rec-item exp-item" data-edit="expense" data-id="'+e.id+'"><span class="k"><span class="dot" style="background:'+c.color+'"></span>'
        +'<span class="t">'+jDate(e.date)+' ・ '+c.name+(e.memo?' ・ '+esc(e.memo):'')+'</span></span><span class="v">'+yen(+e.amount)+'</span></div>'; }).join("");

    elRec.innerHTML =
      '<div class="cal-nav"><button id="recPrev">‹</button><span>'+y+'年'+(m+1)+'月</span><button id="recNext">›</button></div>'
      +'<div class="card"><div class="lbl">今月の合計</div><div class="rec-total"><span class="n">'+yen(total)+'</span>'+diffHtml+'</div>'
      +'<div class="chart">'+bars+'</div><div class="chart-x"><span>1日</span><span>8日</span><span>15日</span><span>22日</span><span>'+days+'日</span></div></div>'
      +'<div class="sec-h"><span class="lbl">カテゴリ別</span></div><div class="card">'+catRows+'</div>'
      +(expRows?'<div class="sec-h"><span class="lbl">明細（タップで編集）</span></div><div class="card">'+expRows+'</div>':'')
      +'<div class="sec-h"><span class="lbl">'+y+'年の推し別合計</span><span class="lbl">計 '+yen(yearTotal)+'</span></div>'
      +'<div class="card">'+(oshiRows||'<div class="empty">今年の記録はありません</div>')+'</div>';
  }

  /* ---------- navigation ---------- */

  var screens={home:elHome,cal:elCal,rec:elRec,my:elMy};

    document.querySelectorAll(".nav .tab").forEach(function(t){ t.classList.toggle("active",t.dataset.tab===tab); });

  /* ---------- overlays ---------- */

      formSheet=document.getElementById("formSheet"), dialog=document.getElementById("dialog");

  /* ---------- toast ---------- */
  var toast=document.getElementById("toast"),tT;
  function showToast(msg){ toast.textContent=msg; toast.classList.add("show"); clearTimeout(tT); tT=setTimeout(function(){ toast.classList.remove("show"); },1700); }

  /* ---------- forms ---------- */
  var formState=null;
  function collOf(type){ return type==="event"?"events":type==="ticket"?"tickets":type==="expense"?"expenses":"oshi"; }
  function oshiOptions(sel){ var o='<option value="">推し未設定</option>'; db.oshi.forEach(function(x){ o+='<option value="'+x.id+'"'+(x.id===sel?" selected":"")+'>'+esc(x.emoji+" "+x.name)+'</option>'; }); return o; }
  function field(label,inner,req,help){ return '<div class="field"><label>'+label+(req?' <span class="req">*</span>':'')+'</label>'+inner+(help?'<div class="fh">'+help+'</div>':'')+'</div>'; }
  function segBtns(id,list,cur){ return '<div class="seg" id="'+id+'">'+list.map(function(o){ return '<button type="button" data-val="'+o.id+'" class="'+(o.id===cur?"on":"")+'">'+o.label+'</button>'; }).join("")+'</div>'; }

  function buildForm(type,item){
    var b=document.getElementById("formBody"), t=item||{};
    formState={ type:type, id:t.id||null, temp:{} };
    document.getElementById("formErr").textContent="";
    document.getElementById("formDelete").style.display = t.id?"":"none";

    if(type==="event"){
      document.getElementById("formTitle").textContent=t.id?"予定を編集":"ライブ・イベント予定";
      b.innerHTML=
        field("タイトル",'<input id="f_title" placeholder="例）○○ ARENA LIVE" value="'+esc(t.title||"")+'">',true)
        +field("種類",'<select id="f_kind">'+["ライブ","コンサート","握手会","ファンミ","発売日","応募締切","当落発表","入金期限","その他"].map(function(k){ return '<option'+((t.kind||"ライブ")===k?" selected":"")+'>'+k+'</option>'; }).join("")+'</select>')
        +field("推し",'<select id="f_oshi">'+oshiOptions(t.oshiId)+'</select>')
        +field("日付",'<input id="f_date" type="date" value="'+(t.date||todayStr())+'">',true)
        +field("会場",'<input id="f_place" placeholder="例）○○アリーナ" value="'+esc(t.place||"")+'">')
        +field("メモ",'<textarea id="f_memo" placeholder="開場時間・座席など">'+esc(t.memo||"")+'</textarea>');
    }
    else if(type==="ticket"){
      document.getElementById("formTitle").textContent=t.id?"チケットを編集":"チケット応募・当落";
      b.innerHTML=
        field("公演名",'<input id="f_title" placeholder="例）大阪公演" value="'+esc(t.title||"")+'">',true)
        +field("推し",'<select id="f_oshi">'+oshiOptions(t.oshiId)+'</select>')
        +'<div class="two">'+field("開催日",'<input id="f_date" type="date" value="'+(t.date||todayStr())+'">',true)
        +field("当落発表日",'<input id="f_result" type="date" value="'+(t.resultDate||"")+'">')+'</div>'
        +field("会場",'<input id="f_place" placeholder="例）大阪城ホール" value="'+esc(t.place||"")+'">')
        +'<div class="two">'+field("座席",'<input id="f_seat" placeholder="例）アリーナA5" value="'+esc(t.seat||"")+'">')
        +field("金額（円）",'<input id="f_amount" type="number" inputmode="numeric" placeholder="9000" value="'+(t.amount!=null?t.amount:"")+'">')+'</div>'
        +field("状態",segBtns("f_status",TSTAT,t.status||"applied"));
      formState.temp.status=t.status||"applied";
    }
    else if(type==="expense"){
      document.getElementById("formTitle").textContent=t.id?"支出を編集":"推し活費の記録";
      var catOpts=CATS.map(function(c){ return '<option value="'+c.id+'"'+((t.category||"ticket")===c.id?" selected":"")+'>'+c.name+'</option>'; }).join("");
      b.innerHTML=
        field("金額（円）",'<input id="f_amount" type="number" inputmode="numeric" placeholder="例）3000" value="'+(t.amount!=null?t.amount:"")+'">',true)
        +'<div class="two">'+field("カテゴリ",'<select id="f_cat">'+catOpts+'</select>')
        +field("推し",'<select id="f_oshi">'+oshiOptions(t.oshiId)+'</select>')+'</div>'
        +field("日付",'<input id="f_date" type="date" value="'+(t.date||todayStr())+'">',true)
        +field("メモ",'<input id="f_memo" placeholder="例）アクスタ・遠征名など" value="'+esc(t.memo||"")+'">');
    }
    else if(type==="oshi"){
      document.getElementById("formTitle").textContent=t.id?"推しを編集":"推しを登録";
      var em=t.emoji||OSHI_EMOJIS[0], col=t.color||OSHI_COLORS[0];
      formState.temp.emoji=em; formState.temp.color=col;
      b.innerHTML=
        field("名前",'<input id="f_name" placeholder="例）推しの名前" value="'+esc(t.name||"")+'">',true)
        +field("アイコン",'<div class="emojis" id="f_emojis">'+OSHI_EMOJIS.map(function(e){ return '<span class="emoji-pick'+(e===em?" on":"")+'" data-emoji="'+e+'">'+e+'</span>'; }).join("")+'</div>')
        +field("推しカラー",'<div class="swatches" id="f_swatches">'+OSHI_COLORS.map(function(c){ return '<span class="swatch'+(c===col?" on":"")+'" data-color="'+c+'" style="background:'+c+'"></span>'; }).join("")+'</div>')
        +'<div class="two">'+field("誕生日",'<input id="f_bday" type="text" inputmode="numeric" placeholder="MM-DD 例）07-15" value="'+esc(t.birthday||"")+'">',false,"月-日で入力")
        +field("所属グループ",'<input id="f_group" placeholder="例）○○" value="'+esc(t.group||"")+'">')+'</div>'
        +field("メモ",'<textarea id="f_memo" placeholder="自由メモ">'+esc(t.memo||"")+'</textarea>');
    }

    var seg=b.querySelector("#f_status");
    if(seg) seg.addEventListener("click",function(e){ var x=e.target.closest("button"); if(!x)return; seg.querySelectorAll("button").forEach(function(q){ q.classList.remove("on"); }); x.classList.add("on"); formState.temp.status=x.dataset.val; });
    var emj=b.querySelector("#f_emojis");
    if(emj) emj.addEventListener("click",function(e){ var p=e.target.closest(".emoji-pick"); if(!p)return; emj.querySelectorAll(".emoji-pick").forEach(function(q){ q.classList.remove("on"); }); p.classList.add("on"); formState.temp.emoji=p.dataset.emoji; });
    var swc=b.querySelector("#f_swatches");
    if(swc) swc.addEventListener("click",function(e){ var p=e.target.closest(".swatch"); if(!p)return; swc.querySelectorAll(".swatch").forEach(function(q){ q.classList.remove("on"); }); p.classList.add("on"); formState.temp.color=p.dataset.color; });

    hideSheets(); formSheet.classList.add("show"); refreshOv(); formSheet.scrollTop=0;
  }

  function openForm(type,id){
    var item=null;
    if(id){ var arr=db[collOf(type)]; for(var i=0;i<arr.length;i++) if(arr[i].id===id){ item=arr[i]; break; } }
    dialog.classList.remove("show");
    buildForm(type,item);
  }
  function val(id){ var el=document.getElementById(id); return el?String(el.value).trim():""; }

  document.getElementById("formCancel").addEventListener("click", closeAll);
  document.getElementById("formSave").addEventListener("click", function(){
    if(!formState) return;
    var err=document.getElementById("formErr"); err.textContent="";
    var type=formState.type, id=formState.id, rec;
    try{
      if(type==="event"){
        if(!val("f_title")){ err.textContent="タイトルを入力してください"; return; }
        if(!val("f_date")){ err.textContent="日付を選んでください"; return; }
        rec={ id:id||uid(), title:val("f_title"), kind:val("f_kind"), oshiId:val("f_oshi")||null, date:val("f_date"), place:val("f_place"), memo:val("f_memo") };
      } else if(type==="ticket"){
        if(!val("f_title")){ err.textContent="公演名を入力してください"; return; }
        var ta=val("f_amount"); rec={ id:id||uid(), title:val("f_title"), oshiId:val("f_oshi")||null, date:val("f_date")||todayStr(), resultDate:val("f_result")||"", place:val("f_place"), seat:val("f_seat"), amount:ta?(parseInt(ta,10)||0):null, status:formState.temp.status||"applied" };
      } else if(type==="expense"){
        var amt=parseInt(val("f_amount"),10);
        if(!(amt>0)){ err.textContent="金額を正しく入力してください（半角数字）"; return; }
        rec={ id:id||uid(), amount:amt, category:val("f_cat")||"other", oshiId:val("f_oshi")||null, date:val("f_date")||todayStr(), memo:val("f_memo") };
      } else if(type==="oshi"){
        if(!val("f_name")){ err.textContent="名前を入力してください"; return; }
        var bd=val("f_bday").replace(/[^0-9-]/g,""); // normalize
        if(bd && bd.indexOf("-")<0 && bd.length===4) bd=bd.slice(0,2)+"-"+bd.slice(2);
        rec={ id:id||uid(), name:val("f_name"), emoji:formState.temp.emoji||"💜", color:formState.temp.color||OSHI_COLORS[0], birthday:bd, group:val("f_group"), memo:val("f_memo") };
      }
      upsert(collOf(type), rec);
      if(!save()){ err.textContent="保存に失敗しました（ストレージ制限の可能性）"; return; }
      applyTheme(); renderAll(); closeAll();
      showToast(id?"更新しました":"保存しました");
    }catch(ex){ err.textContent="エラー: "+(ex&&ex.message?ex.message:ex); }
  });
  function upsert(coll,rec){ var arr=db[coll],f=false; for(var i=0;i<arr.length;i++) if(arr[i].id===rec.id){ arr[i]=rec; f=true; break; } if(!f) arr.push(rec); }

  document.getElementById("formDelete").addEventListener("click", function(){
    if(!formState||!formState.id) return;
    var coll=collOf(formState.type), id=formState.id;
    uiConfirm("この項目を削除しますか？\nこの操作は取り消せません。", function(){
      db[coll]=db[coll].filter(function(x){ return x.id!==id; });
      save(); renderAll(); closeAll(); showToast("削除しました");
    }, "削除する", true);
  });

  /* ---------- delegation ---------- */
  document.addEventListener("click", function(e){
    var t;
    if((t=e.target.closest("[data-add]"))){ openForm(t.dataset.add); return; }
    if((t=e.target.closest("[data-edit]"))){ openForm(t.dataset.edit,t.dataset.id); return; }
    if((t=e.target.closest("[data-go]"))){ go(t.dataset.go); return; }
    if((t=e.target.closest("[data-day]"))){ cur.selDay=t.dataset.day; renderCalendar(); return; }
    if((t=e.target.closest("[data-theme]"))){ db.profile.themeColor=t.dataset.theme; save(); applyTheme(); renderMypage(); showToast("テーマカラーを変更しました"); return; }
    if(e.target.id==="tipSample"){ askSeed(); return; }
  });
  elCal.addEventListener("click", function(e){
    if(e.target.id==="calPrev"){ if(--cur.calM<0){ cur.calM=11; cur.calY--; } renderCalendar(); }
    if(e.target.id==="calNext"){ if(++cur.calM>11){ cur.calM=0; cur.calY++; } renderCalendar(); }
  });
  elRec.addEventListener("click", function(e){
    if(e.target.id==="recPrev"){ if(--cur.recM<0){ cur.recM=11; cur.recY--; } renderRecord(); }
    if(e.target.id==="recNext"){ if(++cur.recM>11){ cur.recM=0; cur.recY++; } renderRecord(); }
  });
  elMy.addEventListener("click", function(e){
    if(e.target.closest("#miHelp")) showHelp();
    else if(e.target.closest("#miSample")) askSeed();
    else if(e.target.closest("#miExport")) exportData();
    else if(e.target.closest("#miReset")) uiConfirm("すべてのデータを消去しますか？\n推し・予定・チケット・支出がすべて削除されます。", function(){ db=blank(); db.profile.welcomed=true; save(); applyTheme(); renderAll(); showToast("消去しました"); }, "消去する", true);
  });
  document.getElementById("btnMenu").addEventListener("click", function(){ go("my"); });
  document.getElementById("btnHelp").addEventListener("click", showHelp);
  addSheet.addEventListener("click", function(e){ var o=e.target.closest("[data-add]"); if(o) openForm(o.dataset.add); });

  /* ---------- sample (idempotent: replace, never duplicate) ---------- */
  function askSeed(){
    var hasData=db.oshi.length||db.events.length||db.tickets.length||db.expenses.length;
    var msg=hasData ? "現在のデータをサンプルデータで置き換えますか？\n（今の内容は削除されます）" : "サンプルデータを追加しますか？\nあとで消去や編集ができます。";
    uiConfirm(msg, function(){ seedSample(); }, hasData?"置き換える":"追加する", hasData);
  }
  function seedSample(){
    var theme=db.profile.themeColor;
    db=blank(); db.profile.welcomed=true; db.profile.themeColor=theme;
    var y=new Date().getFullYear(), m=new Date().getMonth(), last=new Date(y,m+1,0).getDate();
    function ds(day){ return monthKey(y,m)+"-"+pad(Math.min(day,last)); }
    var o1={ id:uid(), name:"みお", emoji:"💜", color:"#9a80d8", birthday:"07-15", group:"Stellar", memo:"最推し" };
    var o2={ id:uid(), name:"れん", emoji:"💙", color:"#4f9df0", birthday:pad(m+1)+"-"+pad(Math.min(22,last)), group:"Stellar", memo:"" };
    db.oshi.push(o1,o2);
    db.events.push(
      { id:uid(), title:"Stellar ARENA LIVE 2025", kind:"ライブ", oshiId:o1.id, date:ds(20), place:"○○アリーナ", memo:"開場17:00 / 開演18:00" },
      { id:uid(), title:"みお 生誕祭イベント", kind:"ファンミ", oshiId:o1.id, date:ds(28), place:"パシフィコ横浜", memo:"" }
    );
    db.tickets.push(
      { id:uid(), title:"ARENA LIVE 大阪公演", oshiId:o1.id, date:ds(24), resultDate:ds(10), place:"大阪城ホール", seat:"アリーナ B7", amount:9800, status:"won" },
      { id:uid(), title:"ARENA LIVE 東京公演", oshiId:o2.id, date:ds(30), resultDate:ds(12), place:"東京ドーム", seat:"", amount:9800, status:"applied" }
    );
    db.expenses.push(
      { id:uid(), amount:9800, category:"ticket", oshiId:o1.id, date:ds(3),  memo:"大阪公演 チケット" },
      { id:uid(), amount:4620, category:"goods",  oshiId:o1.id, date:ds(6),  memo:"アクスタ・ペンライト" },
      { id:uid(), amount:3300, category:"cd",     oshiId:o2.id, date:ds(9),  memo:"新譜 初回盤" },
      { id:uid(), amount:2800, category:"travel", oshiId:o1.id, date:ds(20), memo:"新幹線（大阪）" },
      { id:uid(), amount:8500, category:"hotel",  oshiId:o1.id, date:ds(20), memo:"大阪 1泊" },
      { id:uid(), amount:1200, category:"food",   oshiId:o1.id, date:ds(20), memo:"推しカフェ" }
    );
    save(); applyTheme(); renderAll(); go("home"); showToast("サンプルを入れました");
  }

  function exportData(){
    try{
      var blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"});
      var url=URL.createObjectURL(blob), a=document.createElement("a");
      a.href=url; a.download="oshilog-backup.json"; document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); },500);
      showToast("JSONを書き出しました");
    }catch(err){ showToast("書き出しに失敗しました"); }
  }

  /* ---------- boot ---------- */
  applyTheme(); renderAll(); go("home");
  if(!db.profile.welcomed){
    db.profile.welcomed=true; save();
    setTimeout(function(){
      dialog.innerHTML='<h4>💜 OshiLog へようこそ</h4>'
        +'<div class="dbody"><p>推し活の<b>予定・チケット・支出・推し情報</b>を、これひとつでまとめて管理できるアプリです。</p>'
        +'<p>ホームを開くだけで「次のライブまであと何日か」「今月いくら使ったか」などが一目で分かります。</p>'
        +'<p>まずは下中央の <b style="color:var(--accent)">＋</b> から追加するか、サンプルで雰囲気を試してみてください。</p></div>'
        +'<div class="drow"><button class="btn btn-ghost" id="wStart">自分で始める</button><button class="btn btn-primary" id="wSample">サンプルで試す</button></div>';
      dialog.classList.add("show"); refreshOv();
      document.getElementById("wStart").onclick=function(){ closeAll(); };
      document.getElementById("wSample").onclick=function(){ closeAll(); seedSample(); };
    },350);
  }
})();
</script>
</body>
</html>
