plugins {
    id 'com.android.application'
}

android {
    namespace 'site.ragdollp.codeconv'
    compileSdk 34

    defaultConfig {
        applicationId "site.ragdollp.codeconv"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            // 同梱の使い捨てリリース鍵。Play Store 公開時は各自の鍵に差し替えること。
            storeFile file("../codeconv-release.keystore")
            storePassword "codeconv"
            keyAlias "codeconv"
            keyPassword "codeconv"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
