plugins {
    id 'com.android.application'
}

android {
    namespace 'site.ragdollp.springkey.controller'
    compileSdk 34

    defaultConfig {
        applicationId "site.ragdollp.springkey.controller"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
