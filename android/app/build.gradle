plugins {
    id 'com.android.application'
    // google-services.json を処理して Firebase 設定リソースを生成する。
    id 'com.google.gms.google-services'
}

// ============================================================================
// 📄 ゲーム本体 (game-src/game.html) の同梱
//   v4.0.18 から暗号化 (game.enc) をやめ、game.html をそのまま assets に入れる。
//   Java コードは R8 で難読化し、その対応表 (mapping.txt) は AAB に自動で入る
//   (Play Console の「難読化解除ファイルがありません」警告の対策)。
// ============================================================================
// 🧪 デモ版 (APKPure 用): ./gradlew assembleRelease -PbdDemo
//   game-src/game.demo.html を同梱し、Firebase(通知購読・アナリティクス)と課金を無効化、アプリ名を「デモ版」に。
def bdDemo = project.hasProperty('bdDemo')

def gameAssetOutDir = layout.buildDirectory.dir('generated/gameAssets').get().asFile

task copyGameHtml {
    def srcFile = file(bdDemo ? 'game-src/game.demo.html' : 'game-src/game.html')
    def outFile = new File(gameAssetOutDir, 'game.html')
    inputs.file srcFile
    inputs.property 'bdDemo', bdDemo
    outputs.file outFile
    doLast {
        gameAssetOutDir.mkdirs()
        new File(gameAssetOutDir, 'game.enc').delete()
        new File(gameAssetOutDir, 'game.full.bdx').delete()
        outFile.bytes = srcFile.bytes
        println "[copyGameHtml] wrote ${outFile} (${outFile.length()} bytes)"
    }
}

android {
    namespace 'site.ragdollp.blockdestory'
    buildFeatures { buildConfig true }
    compileSdk 36

    defaultConfig {
        applicationId "site.ragdollp.blockdestory"
        minSdk 24
        targetSdk 36
        versionCode 223
        versionName "4.0.20"
        // 🧪 デモ版: バージョン名に -demo。-PbdDemoVc=<番号> でデモ版だけバージョンコードを上げられる (APKPure の更新用)
        if (bdDemo) {
            versionNameSuffix '-demo'
            if (project.hasProperty('bdDemoVc')) versionCode project.property('bdDemoVc').toString().toInteger()
            // -PbdDemoVn=<名前> でデモ版のバージョン名を指定 (同梱する HTML のバージョンに合わせる)
            if (project.hasProperty('bdDemoVn')) { versionName project.property('bdDemoVn').toString(); versionNameSuffix '' }
        }
        buildConfigField "boolean", "DEMO", (bdDemo ? "true" : "false")
        manifestPlaceholders = [
            appLabel    : (bdDemo ? 'Block Destroy デモ版' : '@string/app_name'),
            fcmAutoInit : (bdDemo ? 'false' : 'true'),
            analyticsOff: (bdDemo ? 'true' : 'false')
        ]
    }

    // 📦 16KB ページサイズ対応 (Android 15+ / Play 要件)。
    //   ネイティブ .so を非圧縮で格納し、AGP が 16KB 境界に整列させる。
    //   これにより AAB→分割APK 生成時もアライメントが崩れない。
    packaging {
        jniLibs {
            useLegacyPackaging false
        }
    }

    signingConfigs {
        release {
            // 同梱のリリース鍵。個人配布/提出用の使い捨て鍵なので Play Store 公開時は
            // 各自の鍵に差し替えること。パスワードは README に記載。
            storeFile file("../blockdestory-release.keystore")
            storePassword "blockdestory"
            keyAlias "blockdestory"
            keyPassword "blockdestory"
            // 📦 互換性のため v1(JAR) + v2 署名を両方有効化。
            //   minSdk 24 だと AGP が v1 を自動で省く場合があり、一部の配信サイト
            //   (APKPure 等)のアップロード検証で弾かれることがあるため明示的にON。
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            // R8 で Java コードを縮小・難読化 (mapping.txt は AAB に自動同梱)。
            //   リソース縮小は WebView 用の資産があるので使わない。
            minifyEnabled true
            shrinkResources false
            // ネイティブライブラリ (.so) のシンボル表を AAB に入れる
            //   (Play Console の「デバッグシンボルがアップロードされていません」警告の対策)。
            ndk { debugSymbolLevel 'SYMBOL_TABLE' }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // HTML はそのまま格納 (再圧縮しない)。
    aaptOptions {
        noCompress 'html'
    }

    // game.html を assets として同梱する。
    sourceSets {
        main {
            assets.srcDirs += gameAssetOutDir
        }
    }
}

// アセットのマージ前に必ず game.html をコピーする (debug/release 両方)。
tasks.matching { it.name.startsWith('merge') && it.name.endsWith('Assets') }.configureEach {
    dependsOn copyGameHtml
}
tasks.matching { it.name == 'preBuild' }.configureEach {
    dependsOn copyGameHtml
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    // 同梱HTMLを https://appassets.androidplatform.net/ で配信 (reCAPTCHA用の正規オリジン)
    implementation 'androidx.webkit:webkit:1.11.0'

    // Firebase BoM (バージョンは BoM が一括管理するので個別指定しない)
    implementation platform('com.google.firebase:firebase-bom:34.17.0')
    // Firebase Analytics
    implementation 'com.google.firebase:firebase-analytics'
    // Firebase Cloud Messaging (イベントのプッシュ通知)
    implementation 'com.google.firebase:firebase-messaging'

    // 📢 Google AdMob (アプリ内広告)。WebView内のAdSenseから移行。
    implementation 'com.google.android.gms:play-services-ads:23.6.0'

    // 💳 Google Play 課金 (アプリ内課金)。既定は無効 (MainActivity.BILLING_ENABLED=false)。
    //   有効化するには BILLING_ENABLED=true にして Play Console で商品IDを登録するだけ。
    //   Play 要件: 2026/8/31 以降は Billing Library 8 以上が必須。
    implementation 'com.android.billingclient:billing:8.0.0'
}
