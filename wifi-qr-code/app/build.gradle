plugins {
    id 'com.android.application'
}

android {
    namespace 'com.springcat.wifiqrcode'
    compileSdk 34

    defaultConfig {
        applicationId "com.springcat.wifiqrcode"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            // 同梱の使い捨てリリース鍵 (パスワードはREADME参照)。Play Store公開時は各自の鍵に差し替えること。
            storeFile file("../wifiqrcode-release.keystore")
            storePassword "wifiqrcode"
            keyAlias "wifiqrcode"
            keyPassword "wifiqrcode"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.activity:activity:1.9.3'
    // QRコードのエンコードのみに使用 (画面表示・通信は行わない、純粋なJavaライブラリ)
    implementation('com.google.zxing:core:3.5.3') {
        exclude group: 'javax.xml.bind'
    }
}
