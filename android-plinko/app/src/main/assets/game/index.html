<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover"/>
<title>3D プリンコ</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#101014;color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
    overflow:hidden;touch-action:none;}
  #hud{position:fixed;top:env(safe-area-inset-top,0);left:0;right:0;
    display:flex;justify-content:space-between;padding:12px 16px;
    pointer-events:none;z-index:10;}
  #hud .pill{background:rgba(0,0,0,0.5);border:1px solid rgba(255,255,255,0.15);
    border-radius:999px;padding:8px 14px;font-size:14px;backdrop-filter:blur(4px);}
  #hud .score{font-size:18px;font-weight:700;color:#ffd166;}
  #hint{position:fixed;left:0;right:0;top:50%;transform:translateY(-50%);
    text-align:center;font-size:13px;color:#aab;opacity:.9;pointer-events:none;z-index:9;}
  #last{position:fixed;left:0;right:0;top:40%;text-align:center;
    font-weight:800;font-size:42px;color:#ffd166;text-shadow:0 2px 12px rgba(0,0,0,.6);
    opacity:0;transition:opacity .3s;pointer-events:none;z-index:11;}
  canvas{display:block;width:100vw;height:100vh;}
  #reset{position:fixed;bottom:env(safe-area-inset-bottom,0);left:50%;transform:translateX(-50%);
    margin-bottom:12px;padding:10px 18px;border-radius:999px;
    background:#2a9d8f;color:#fff;border:0;font-size:14px;z-index:10;}
</style>
</head>
<body>
  <div id="hud">
    <div class="pill">スコア <span class="score" id="score">0</span></div>
    <div class="pill">ボール <span id="balls">0</span></div>
  </div>
  <div id="hint">上の方をタップでボールが落ちます</div>
  <div id="last"></div>
  <button id="reset">リセット</button>

  <script src="three.min.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
