plugins {
    id 'com.android.application'
}

android {
    namespace 'site.ragdollp.copytool'
    compileSdk 35

    defaultConfig {
        applicationId "site.ragdollp.copytool"
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName "1.2"
    }

    signingConfigs {
        release {
            // 個人配布/検証用の使い捨て自己署名鍵。Play 公開時は各自の鍵に差し替えること。
            storeFile file("../copytool-release.keystore")
            storePassword "copytool2026"
            keyAlias "copytool"
            keyPassword "copytool2026"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // 同梱 HTML は再圧縮しない
    androidResources {
        noCompress 'html'
    }
}

dependencies {
    // FileProvider（大きなテキストをURI経由でクリップボードに載せるために使用）
    implementation 'androidx.core:core:1.13.1'
}
