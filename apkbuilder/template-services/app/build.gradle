plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.apkbuilder.templateservices'
    // Firebase BoM 34.x requires compileSdk 35 (mirrors ../../android/app/build.gradle,
    // a known-working config already in this repo).
    compileSdk 35

    defaultConfig {
        applicationId "com.apkbuilder.templateservices"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }

    // The game HTML/JS is arbitrary web content swapped in later by the APK
    // Builder engine; keep it uncompressed so byte-for-byte replacement in the
    // packaged zip never has to worry about compression ratio changes.
    aaptOptions {
        noCompress 'html', 'js', 'css', 'json', 'enc'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.webkit:webkit:1.11.0'

    // Firebase (no google-services plugin: no build-time google-services.json is bound here —
    // the generated app configures FirebaseOptions itself at runtime from assets/firebase-config.json,
    // built on-device from the user's own google-services.json). Inert with no config asset present.
    implementation platform('com.google.firebase:firebase-bom:34.17.0')
    implementation 'com.google.firebase:firebase-analytics'

    // AdMob. Inert unless assets/admob-config.json is present (the manifest's required
    // APPLICATION_ID meta-data is only added by the builder when AdMob is configured).
    implementation 'com.google.android.gms:play-services-ads:23.6.0'
}
