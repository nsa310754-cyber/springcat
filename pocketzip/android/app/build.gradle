plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'site.ragdollp.pocketzip'
    compileSdk 35

    defaultConfig {
        applicationId "site.ragdollp.pocketzip"
        // 30+ (Android 11+) 固定。「すべてのファイルへのアクセス」権限
        // (MANAGE_EXTERNAL_STORAGE) は API 30 で追加されたもので、これが
        // 無いと端末内の全ファイルを横断スキャンできない。古い OS 版の
        // スコープドストレージ移行期(API 29 など)の互換分岐を避けるため
        // 下限を素直に 30 にしている。
        minSdk 30
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            storeFile file("../pocketzip-release.keystore")
            storePassword "pocketzip"
            keyAlias "pocketzip"
            keyPassword "pocketzip"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.14'
    }
    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.09.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.6'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}
