# mkexe が使う C コンパイラ TCC (bionic 用・glibc 用) を Android NDK でビルドし、Artifacts に置く。
# PC が無くても、GitHub の Actions の画面から「Run workflow」で実行できる。
# 出来上がるもの (Artifacts の mkexe-tcc):
#   libtccbionic.so / libtccglibc.so … 端末で動く TCC (64bit ARM の Android 用)
#   arm64-v8a.zip                     … TCC のヘッダと libtcc1.a
#   mkexe.sh                          … mkexe 本体
name: build-mkexe
on:
  workflow_dispatch:
  push:
    paths:
      - 'bionic-runner/native/build-tcc.sh'
      - '.github/workflows/build-mkexe.yml'
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: 必要なコマンド
        run: sudo apt-get update && sudo apt-get install -y gcc make zip git
      - name: TCC をビルド
        run: |
          # GitHub のランナーには Android NDK が入っている (ANDROID_NDK_LATEST_HOME)
          ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}" bionic-runner/native/build-tcc.sh
      - name: 出来上がりを表示
        run: ls -l bionic-runner/native/tcc-build/libtccbionic.so bionic-runner/native/tcc-build/libtccglibc.so
      - uses: actions/upload-artifact@v4
        with:
          name: mkexe-tcc
          path: |
            bionic-runner/app/src/main/jniLibs/arm64-v8a/libtccbionic.so
            bionic-runner/app/src/main/jniLibs/arm64-v8a/libtccglibc.so
            bionic-runner/app/src/main/assets/mkexe/arm64-v8a.zip
            bionic-runner/app/src/main/assets/mkexe/mkexe.sh
