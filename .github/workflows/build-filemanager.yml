name: Build File Manager APK

# filemanager/ (SpringCat Files) の APK をビルドして成果物として公開する。
# 手動実行 (workflow_dispatch) か、filemanager 配下の変更 push で走る。

on:
  push:
    branches: ["**"]
    paths:
      - "filemanager/**"
      - ".github/workflows/build-filemanager.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        working-directory: filemanager
        run: chmod +x gradlew

      - name: Build debug & release APK
        working-directory: filemanager
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SpringCatFiles-debug
          path: filemanager/app/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: SpringCatFiles-release
          path: filemanager/app/build/outputs/apk/release/*.apk
