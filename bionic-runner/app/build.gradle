plugins {
    id 'com.android.application'
}

android {
    namespace 'site.springcat.bionicrunner'
    compileSdk 35

    defaultConfig {
        applicationId "site.springcat.bionicrunner"
        minSdk 24
        targetSdk 34
        versionCode 33
        versionName "1.19.0"
    }

    // 配布(サイドロード)用の固定鍵。再ビルドしても署名が変わらず上書き更新できる。
    signingConfigs {
        sideload {
            storeFile file('../bionicrunner.keystore')
            storePassword 'bionicrunner'
            keyAlias 'bionicrunner'
            keyPassword 'bionicrunner'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.sideload
        }
        debug {
            signingConfig signingConfigs.sideload
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // 補助プログラム ptyrun (lib/<ABI>/libptyrun.so) を実行できるよう、インストール時に
    // APK から取り出してもらう。圧縮したまま APK 内に置く新方式だと exec できない。
    packaging {
        jniLibs {
            useLegacyPackaging true
            // libbrld.so は glibc のローダそのもの。Android 用の加工 (記号の削除) をさせない
            keepDebugSymbols += ['**/libbrld.so']
        }
    }

    // CPU の種類ごとに分けた APK も作る (その CPU 用の部品だけが入るので小さい)。
    // すべての CPU 用を入れた APK (universal) も作る。GitHub の 1 ファイル 100MB の上限を超えないよう、
    // 配布はまず CPU ごとの方を使う
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a', 'x86_64', 'x86'
            universalApk true
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

// glibc ランタイムは fetch-glibc.sh が取得する (リポジトリには入れていない)。
// 無いまま進むと glibc 抜きの APK が黙ってできてしまうので、ビルドを止めて知らせる。
tasks.named('preBuild') {
    doFirst {
        if (!file('src/main/assets/glibc/VERSIONS.txt').exists()
                || !file('src/main/jniLibs/arm64-v8a/libbrld.so').exists()) {
            throw new GradleException('glibc ランタイムがありません。先に ./fetch-glibc.sh を実行してください')
        }
    }
}
