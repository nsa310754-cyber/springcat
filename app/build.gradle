plugins {
    id 'com.android.application'
}

android {
    namespace 'com.springcat.polyglot'
    compileSdk 34

    defaultConfig {
        applicationId "com.springcat.polyglot"
        minSdk 26
        targetSdk 34
        versionCode 8
        versionName "1.7"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
